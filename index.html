      '<button class="btn sm" onclick="boForget(' + jsq(e.w) + ')">删除</button>' +
      '</div></div>').join('') + '</div>';

  shell('我的藏语发音', body);
};

/* 从管理页直接打开这个词的编辑面板 */
function boEditFrom(word) {
  BO.edit = true;
  sheet('<div class="wh"><span class="ww tb">' + esc(word) + '</span></div>' + boPanel(word));
  setTimeout(() => { if ($('bopin')) $('bopin').focus(); }, 60);
}
function boForget(word) {
  const k = boKey(word);
  if (!confirm('把「' + k + '」整条删掉？注音和录音都会消失。')) return;
  boDrop(k);
  render();
  toast('已删除');
}
/* ================= Yulengua · 场景对话 ================= */

const D = { lang: null, started: false, topic: '', scene: '', role: '', msgs: [], busy: false, err: '' };

VIEWS.dlg = function (k) {
  if (D.lang !== k) { D.lang = k; D.started = false; D.topic = ''; D.scene = ''; D.msgs = []; D.err = ''; }
  paintDlg();
};

function autoSpeakBtn() {
  const on = !!S.cfg.autoSpeak;
  return '<button class="swi' + (on ? ' on' : '') + '" onclick="toggleAutoSpeak()">' +
    '<span class="kn"><i></i></span>' + (on ? '自动朗读 开' : '自动朗读 关') + '</button>';
}
function toggleAutoSpeak() {
  S.cfg.autoSpeak = !S.cfg.autoSpeak; saveCfg();
  paintDlg();
  if (S.cfg.autoSpeak) {
    const last = D.msgs.filter(m => m.who === 'sys').pop();
    if (last) say(D.lang, last.line);
  } else if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
}

function paintDlg() {
  const k = D.lang, L = LANGS[k];

  if (!D.started) {
    const h = '<div class="sec">情景设定</div>' +
      '<p class="note" style="margin-top:0;margin-bottom:16px">随便写一个提示，比如「在阿姆斯特丹的面包店买早餐」「跟房东报修暖气」「和同事聊周末」。系统会据此搭建场景，用' + L.zh + '（' + L.dialogue + '）和你一句一句对话，并在每轮批改你的回复。</p>' +
      '<textarea class="fld" id="topic" style="min-height:110px" placeholder="例如：在药店买感冒药"></textarea>' +
      '<div class="tbar" style="margin:16px 0 0">' + autoSpeakBtn() +
      '<span class="hint">开启后系统每句话会自动朗读</span></div>' +
      (D.err ? '<div class="err">' + esc(D.err) + '</div>' : '') +
      '<div class="spacer"></div>' +
      '<button class="btn pri wide" id="startBtn" onclick="startDlg()">开始对话</button>';
    shell(L.zh + ' · 场景对话', h);
    return;
  }

  let body = '<div class="tbar">' + autoSpeakBtn() +
    '<button class="btn sm" onclick="makeDlgCard()">生成卡片</button>' +
    '<button class="btn sm" onclick="resetDlg()">换一个场景</button></div>' +
    '<div class="scene"><b>场景</b>' + esc(D.scene) + (D.role ? '（对方：' + esc(D.role) + '）' : '') +
    '<div class="hint" style="margin-top:9px">点对方的话或批改句里的任意单词可查看释义' +
    (S.cfg.autoSpeak ? '。自动朗读已开启，对方的话会先只发音，点「显示文本」才出字' : '') + '</div></div>';

  D.msgs.forEach((m, i) => {
    if (m.fix) {
      body += '<div class="fix"><b class="h">' + (m.fix.verdict === 'ok' ? '批改 · 正确' : '批改 · 修正后') + '</b>' +
        (m.fix.corrected
          ? '<div class="cor"><span class="' + scriptCls(k) + '">' +
            tapWords(k, m.fix.corrected, m.fix.ctokens, m.fix.cgloss, 'f' + i) + '</span>' +
            (L.tts ? '<button class="btn sm" data-fx="' + i + '">&#9654;</button>' : '') + '</div>'
          : '') +
        '<div class="nt">' + esc(m.fix.note || '') + '</div></div>';
    }
    const veiled = m.who === 'sys' && m.reveal === false;
    body += '<div class="msg ' + (m.who === 'me' ? 'me' : 'sys') + '">';
    const isLast = i === D.msgs.length - 1;
    if (veiled) {
      body += '<div class="bub veil">&#9834; 已朗读，先听一遍</div>' +
        '<div class="ctl">' +
        (L.tts ? '<button data-s="' + i + '">&#9654; 重听</button>' : '') +
        '<button data-rv="' + i + '">显示文本</button>' +
        (isLast ? '<button data-rg="1">&#8635; 重新生成</button>' : '') +
        '</div>';
    } else {
      body += '<div class="bub ' + scriptCls(k) + '">' +
        (m.who === 'sys' ? tapWords(k, m.line, m.tokens, m.gloss, 's' + i) : esc(m.line)) + '</div>';
      if (m.who === 'sys') {
        body += '<div class="tr' + (m.show ? ' on' : '') + '">' + esc(m.zh || '') +
          (L.en && m.en ? '<div class="e">' + esc(m.en) + '</div>' : '') + '</div>' +
          '<div class="ctl">' +
          '<button data-t="' + i + '">' + (m.show ? '隐藏翻译' : '显示翻译') + '</button>' +
          (L.tts ? '<button data-s="' + i + '">&#9654; 发音</button>' : '') +
          (isLast ? '<button data-rg="1">&#8635; 重新生成</button>' : '') +
          '</div>';
      }
    }
    body += '</div>';
  });

  if (D.busy) body += '<div style="margin:8px 0 18px">' + LOADER + '</div>';
  if (D.err) body += '<div class="err">' + esc(D.err) +
    '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="retryDlg()">&#8635; 重新生成</button></div></div>';

  const bar = '<div class="askbar">' +
    '<textarea id="dlgin" rows="1" placeholder="用' + L.zh + '回复…" oninput="autosize(this)"></textarea>' +
    '<button class="go" onclick="sendDlg()">&#8593;</button></div>';

  shell(L.zh + ' · 场景对话', body, { bar: bar });

  document.querySelectorAll('[data-t]').forEach(b => {
    b.onclick = () => { const i = +b.dataset.t; D.msgs[i].show = !D.msgs[i].show; paintDlg(); };
  });
  document.querySelectorAll('[data-s]').forEach(b => {
    b.onclick = () => say(k, D.msgs[+b.dataset.s].line, b);
  });
  document.querySelectorAll('[data-rv]').forEach(b => {
    b.onclick = () => { D.msgs[+b.dataset.rv].reveal = true; paintDlg(); };
  });
  document.querySelectorAll('[data-rg]').forEach(b => { b.onclick = () => retryDlg(); });
  document.querySelectorAll('[data-fx]').forEach(b => {
    b.onclick = () => say(k, D.msgs[+b.dataset.fx].fix.corrected, b);
  });
  bindTapWords(k, g => {
    const m = D.msgs[+g.slice(1)];
    if (!m) return null;
    return g[0] === 'f'
      ? { text: m.fix.corrected, tokens: m.fix.ctokens, gloss: m.fix.cgloss }
      : { text: m.line, tokens: m.tokens, gloss: m.gloss };
  });
  window.scrollTo(0, document.body.scrollHeight);
}

function resetDlg() { D.started = false; D.msgs = []; D.err = ''; paintDlg(); }

function mkSys(j, fb) {
  const m = {
    who: 'sys', line: (j.line || '').trim(), zh: j.zh || '', en: j.en || '', show: false,
    reveal: !S.cfg.autoSpeak,
    tokens: Array.isArray(j.tokens) ? j.tokens : [], gloss: Array.isArray(j.gloss) ? j.gloss : []
  };
  if (fb) m.fix = {
    verdict: fb.verdict === 'ok' ? 'ok' : 'fix',
    corrected: (fb.corrected || '').trim(),
    note: fb.note || '',
    ctokens: Array.isArray(fb.ctokens) ? fb.ctokens : [],
    cgloss: Array.isArray(fb.cgloss) ? fb.cgloss : []
  };
  return m;
}

async function startDlg() {
  if (needKey()) return;
  const t = $('topic').value.trim();
  if (!t) { toast('先写一句提示'); return; }
  const b = $('startBtn'); b.innerHTML = LOADER + ' 正在搭建场景'; b.disabled = true;
  D.topic = t; D.err = '';
  try {
    const j = await aiJson(dlgOpenPrompt(D.lang, t));
    if (!(j.line || '').trim()) throw new Error('模型返回了空回复');
    D.scene = j.scene || t; D.role = j.role || '';
    D.msgs = [mkSys(j)];
    D.started = true;
    paintDlg();
    if (S.cfg.autoSpeak) say(D.lang, D.msgs[0].line);
    return;
  } catch (e) { D.err = '启动失败 · ' + e.message; }
  paintDlg();
}

/* 跑一轮：批改上一句 + 接一句。空回复视为失败，可以重来 */
async function runTurn(userLine) {
  try {
    const hist = D.msgs.slice(0, -1).map(m => ({ who: m.who, line: m.line }));
    const j = await aiJson(dlgTurnPrompt(D.lang, D.scene, hist, userLine));
    if (!(j.line || '').trim()) throw new Error('模型返回了空回复');
    D.msgs.push(mkSys(j, j.feedback || {}));
    D.busy = false; paintDlg();
    if (S.cfg.autoSpeak) say(D.lang, D.msgs[D.msgs.length - 1].line);
    return;
  } catch (e) { D.err = '这一轮没成功 · ' + e.message; }
  D.busy = false; paintDlg();
}

async function sendDlg() {
  if (needKey() || D.busy) return;
  const ta = $('dlgin'); const t = ta.value.trim();
  if (!t) return;
  ta.value = ''; autosize(ta); ta.blur();
  D.msgs.push({ who: 'me', line: t });
  D.busy = true; D.err = ''; paintDlg();
  await runTurn(t);
}

/* 重新生成：既用于「这条回复我不满意/是空的」，也用于失败后重试 */
async function retryDlg() {
  if (needKey() || D.busy || !D.msgs.length) return;
  let last = D.msgs.length - 1;

  if (D.msgs[last].who === 'sys' && last === 0) {      // 重新生成开场白
    D.busy = true; D.err = ''; paintDlg();
    try {
      const j = await aiJson(dlgOpenPrompt(D.lang, D.topic || D.scene));
      if (!(j.line || '').trim()) throw new Error('模型返回了空回复');
      D.scene = j.scene || D.scene; D.role = j.role || D.role;
      D.msgs = [mkSys(j)];
      D.busy = false; paintDlg();
      if (S.cfg.autoSpeak) say(D.lang, D.msgs[0].line);
      return;
    } catch (e) { D.err = '重新生成失败 · ' + e.message; }
    D.busy = false; paintDlg();
    return;
  }

  if (D.msgs[last].who === 'sys') { D.msgs.pop(); last--; }
  if (!D.msgs[last] || D.msgs[last].who !== 'me') { paintDlg(); return; }
  D.busy = true; D.err = ''; paintDlg();
  await runTurn(D.msgs[last].line);
}

/* ---------- 生成对话卡片 ---------- */
function correctedFor(i) {
  const nxt = D.msgs[i + 1];
  return (nxt && nxt.fix && nxt.fix.corrected) ? nxt.fix.corrected : D.msgs[i].line;
}
/* 卡片正面由本地拼装，保证 [F##...] 填空标记一定正确 */
function dlgFront() {
  const who = D.role ? D.role : '对方';
  const lines = [D.scene, ''];
  D.msgs.forEach((m, i) => {
    if (m.who === 'sys') lines.push(who + '：' + m.line);
    else lines.push('我：[F##' + correctedFor(i) + ']');
  });
  return lines.join('\n');
}
/* 整张卡片都在本地拼装，不调用 AI：只要对话本身 + 填空 */
function makeDlgCard() {
  if (D.msgs.filter(m => m.who === 'me').length === 0) { toast('先回复几句再生成卡片'); return; }
  DE.mode = 'raw';
  go('dedit', {
    lang: D.lang,
    front: '对话 · ' + D.scene.slice(0, 30),
    text: markjiLint(dlgFront()).text
  });
}
/* ================= Yulengua · 单词查询 ================= */

const W = { q: '', items: [], sel: 0, qa: [], busy: false, err: '' };

VIEWS.lookup = function () { paintLookup(); };

function paintLookup() {
  let body = '<input class="fld" id="wq" autocapitalize="off" spellcheck="false" ' +
    'placeholder="输入任意语言的词、中文、注音…" value="' + esc(W.q) + '" ' +
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();doLookup()}">' +
    '<div class="spacer"></div>' +
    '<button class="btn pri wide" onclick="doLookup()">查询</button>';

  if (W.err) body += '<div class="err">' + esc(W.err) + '</div>';
  if (W.busy) body += '<div style="margin-top:22px">' + LOADER + ' 正在查询</div>';

  if (W.items.length) {
    body += '<div class="sec">结果 · 共 ' + W.items.length + ' 条</div>';
    W.items.forEach((it, i) => {
      const L = LANGS[it.lang] || LANGS.nl;
      body += '<div class="card" style="margin-bottom:14px;' + (i === W.sel ? 'border-color:var(--fg2)' : '') + '" data-pick="' + i + '">' +
        '<div class="wh">' +
        '<span class="ww ' + scriptCls(it.lang) + '" style="font-size:23px">' + esc(it.word || '') + '</span>' +
        (it.gender ? '<span class="tag' + (it.lang === 'nl' && /het/i.test(it.gender) ? ' k' : '') + '">' + esc(it.gender) + '</span>' : '') +
        (it.pos ? '<span class="tag">' + esc(it.pos) + '</span>' : '') +
        '<span class="lm">' + esc(L.zh) + '</span>' +
        '</div>' +
        (it.alt ? '<div class="ar" style="font-size:19px;margin-top:6px">' + esc(it.alt) + '</div>' : '') +
        (it.translit ? '<div class="translit" style="margin-top:5px">' + esc(it.translit) + '</div>' : '') +
        '<div class="def" style="font-size:15.5px">' + esc(it.zh || '') +
        (it.en ? '<div class="hint" style="margin-top:4px;font-size:13px">' + esc(it.en) + '</div>' : '') + '</div>' +
        (it.example && it.example.text
          ? '<div class="ex"><span class="' + scriptCls(it.lang) + '">' + esc(it.example.text) + '</span>' +
            (it.lang === 'kk' ? '<div class="ar" style="font-size:18px;margin-top:4px">' + esc(kkArab(it.example.text)) + '</div>' : '') +
            (it.lang === 'ru' ? '<div class="translit" style="margin-top:3px">' + esc(ruLat(it.example.text)) + '</div>' : '') +
            '<s>' + esc(it.example.zh || '') + '</s></div>' : '') +
        (Array.isArray(it.forms) && it.forms.length
          ? '<div class="forms">' + it.forms.map(f => '<div><span>' + esc(typeof f === 'string' ? f : (f.k ? f.k + '：' + f.v : f.v)) + '</span></div>').join('') + '</div>' : '') +
        '<div class="row" style="margin-top:16px">' +
        (L.tts ? '<button class="btn sm" data-spk="' + i + '">&#9654; 发音</button>' : '') +
        '<button class="btn sm" data-card="' + i + '">生成卡片</button>' +
        (i === W.sel ? '<span class="hint" style="margin-left:auto">追问对象</span>' : '') +
        '</div></div>';
    });
  }

  if (W.qa.length) {
    body += '<div class="qa">' + W.qa.map(x =>
      '<div class="q">' + esc(x.q) + '</div><div class="a">' + esc(x.a) + '</div>').join('') + '</div>';
  }

  const bar = W.items.length ? '<div class="askbar">' +
    '<textarea id="wask" rows="1" placeholder="对结果继续追问…" oninput="autosize(this)"></textarea>' +
    '<button class="go" onclick="askWord()">&#8593;</button></div>' : '';

  shell('单词查询', body, { bar: bar, right: NAV_LIB });

  document.querySelectorAll('[data-pick]').forEach(c => {
    c.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      W.sel = +c.dataset.pick; paintLookup();
    });
  });
  document.querySelectorAll('[data-spk]').forEach(b => {
    b.onclick = () => { const it = W.items[+b.dataset.spk]; say(it.lang, it.word, b); };
  });
  document.querySelectorAll('[data-card]').forEach(b => {
    b.onclick = () => makeWordCard(+b.dataset.card, b);
  });
}

async function doLookup() {
  if (needKey()) return;
  const q = $('wq').value.trim();
  if (!q) return;
  $('wq').blur();
  W.q = q; W.busy = true; W.err = ''; W.items = []; W.qa = []; W.sel = 0;
  paintLookup();
  try {
    const j = await aiJson(lookupPrompt(q));
    W.items = (j.items || []).filter(x => x && x.word && LANGS[x.lang]);
    W.items.forEach(it => {
      if (it.lang === 'kk') { it.alt = kkArab(it.word); it.translit = kkLat(it.word); }
      if (it.lang === 'ru') {
        it.translit = ruLat(it.translit || it.word);
        it.word = ruPlain(it.word);
        if (it.example && it.example.text) it.example.text = ruPlain(it.example.text);
      }
    });
    if (!W.items.length) W.err = '没有找到匹配的词，换个写法试试。';
  } catch (e) { W.err = '查询失败 · ' + e.message; }
  W.busy = false; paintLookup();
}

async function askWord() {
  if (needKey() || W.busy) return;
  const ta = $('wask'); const q = ta.value.trim();
  if (!q) return;
  ta.value = ''; autosize(ta); ta.blur();
  W.busy = true; W.qa.push({ q: q, a: '…' }); paintLookup();
  try {
    const a = await ai(lookupAskPrompt(W.items[W.sel], W.qa.slice(0, -1), q), false);
    W.qa[W.qa.length - 1].a = a;
  } catch (e) { W.qa.pop(); W.err = '追问失败 · ' + e.message; }
  W.busy = false; paintLookup();
  window.scrollTo(0, document.body.scrollHeight);
}

async function makeWordCard(i, btn) {
  if (needKey()) return;
  const it = W.items[i];
  const old = btn.innerHTML; btn.innerHTML = '生成中…'; btn.disabled = true;
  try {
    let txt = await ai(wordCardPrompt(it, W.qa), false);
    if (it.lang === 'kk') txt = kkDual(txt);
    if (it.lang === 'ru') txt = ruDual(txt);
    txt = markjiLint(txt).text;
    DE.mode = 'raw';
    go('dedit', { lang: it.lang, front: it.word, text: txt.trim() });
  } catch (e) {
    btn.innerHTML = old; btn.disabled = false;
    toast('生成失败 · ' + e.message);
  }
}
/* ================= Yulengua · 卡片库 ================= */

const LIB = { open: {} };

VIEWS.lib = function () { paintLib(); };

function paintLib() {
  if (!S.cards.length) {
    shell('卡片批量生成',
      '<div class="empty"><span class="big">&#9634;</span>卡片库是空的<br>在句子阅读或单词查询中生成的卡片会出现在这里</div>' +
      (S.trash ? '<button class="btn wide" onclick="undoDel()">撤销上一次删除（' + S.trash.items.length + ' 张）</button>' : ''));
    return;
  }
  const done = S.cards.filter(c => c.added).length;
  let body = '<div class="row" style="margin-bottom:4px">' +
    '<button class="btn sm" onclick="copyAll()">复制全部</button>' +
    '<button class="btn sm" onclick="delAdded()"' + (done ? '' : ' disabled') + '>删除已添加（' + done + '）</button>' +
    (S.trash ? '<button class="btn sm" onclick="undoDel()">撤销删除</button>' : '') +
    '</div>' +
    '<p class="note" style="margin-bottom:14px">共 ' + S.cards.length + ' 张。复制后到你的卡片工具里粘贴，再勾选「已添加」批量清理。</p>' +
    '<div class="lib">';

  S.cards.forEach(c => {
    const L = LANGS[c.lang] || {};
    const op = !!LIB.open[c.id];
    body += '<div class="lc' + (c.added ? ' done' : '') + '">' +
      '<div class="top">' +
      '<button class="cb" data-chk="' + c.id + '">' + (c.added ? '&#10003;' : '') + '</button>' +
      '<div class="fr"><span class="' + scriptCls(c.lang) + '">' + esc(c.front) + '</span>' +
      '<div class="mt">' + esc(L.code || '') + ' · ' + new Date(c.ts).toLocaleDateString('zh-CN') + '</div></div>' +
      '</div>' +
      '<div class="acts">' +
      '<button class="btn sm pri" data-copy="' + c.id + '">复制</button>' +
      '<button class="btn sm" data-open="' + c.id + '">' + (op ? '收起' : '查看详解') + '</button>' +
      '<button class="btn sm" data-edit="' + c.id + '">编辑</button>' +
      '<button class="btn sm" data-del="' + c.id + '">删除</button>' +
      '</div>' +
      (op ? '<div class="pre">' + esc(c.detail) + '</div>' : '') +
      '</div>';
  });
  body += '</div>';
  shell('卡片批量生成', body);

  document.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => {
    const c = S.cards.find(x => x.id === b.dataset.chk); c.added = !c.added; saveCards(); paintLib();
  });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    copyText(S.cards.find(x => x.id === b.dataset.copy).detail);
  });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    LIB.open[b.dataset.open] = !LIB.open[b.dataset.open]; paintLib();
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const c = S.cards.find(x => x.id === b.dataset.edit);
    go('cedit', { id: c.id, text: c.detail, lang: c.lang });
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delCards([b.dataset.del]));
}

function copyAll() { copyText(S.cards.map(c => c.detail).join('\n\n========\n\n')); }

function delCards(ids) {
  const items = [];
  ids.forEach(id => {
    const i = S.cards.findIndex(x => x.id === id);
    if (i > -1) items.push({ i: i, c: S.cards[i] });
  });
  if (!items.length) return;
  items.sort((a, b) => b.i - a.i).forEach(o => S.cards.splice(o.i, 1));
  S.trash = { items: items.slice().sort((a, b) => a.i - b.i) };
  saveCards(); paintLib();
  toast('已删除 ' + items.length + ' 张', '撤销', undoDel);
}
function delAdded() {
  const ids = S.cards.filter(c => c.added).map(c => c.id);
  if (!ids.length) return;
  delCards(ids);
}
function undoDel() {
  if (!S.trash) { toast('没有可撤销的删除'); return; }
  S.trash.items.forEach(o => S.cards.splice(Math.min(o.i, S.cards.length), 0, o.c));
  S.trash = null; saveCards(); paintLib(); toast('已恢复');
}

/* edit an existing card's detail */
VIEWS.cedit = function (d) {
  const h = deditBody({ text: d.text, lang: d.lang }, 'ctext') +
    '<div class="spacer"></div>' +
    '<div class="split">' +
    '<button class="btn" onclick="copyText(deText(\'ctext\'))">复制</button>' +
    '<button class="btn pri" onclick="saveEdit()">保存修改</button>' +
    '<button class="btn" onclick="back()">取消</button>' +
    '</div>';
  shell('编辑卡片', h);
  bindDedit('ctext');
};
function saveEdit() {
  const cu = S.stack[S.stack.length - 1].arg;
  const c = S.cards.find(x => x.id === cu.id);
  if (c) { c.detail = deText('ctext'); saveCards(); }
  back(); toast('已保存');
}
/* ================= boot ================= */
$('mask').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('error', e => { try { toast('脚本错误：' + e.message); } catch (x) {} });

app().innerHTML = '<div class="screen on"><div class="body">' +
  '<div class="brand"><h1>Yulengua</h1><div class="rule"></div><p>六语学习</p></div></div></div>';

loadAll().catch(() => {}).then(() => {
  S.stack = [{ view: 'home' }];
  render();
  if (ossReady()) {
    CLOUD.last = S.cfg.lastCloud || 0;
    cloudSync(false).then(ok => { if (ok) render(); });
  }
});
/* 切回前台时补一次同步，换设备读同一份数据时不至于看到旧内容 */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ossReady() && Date.now() - (CLOUD.last || 0) > 120000) cloudSync(false);
});
