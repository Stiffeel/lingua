  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --fg:#f2f2f2; --fg2:#a0a0a0; --fg3:#6a6a6a;
    --line:#242424; --line2:#3a3a3a; --soft:#131313; --inv-bg:#f2f2f2; --inv-fg:#000000;
    --sh:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ---------- layout ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:100vh}
.screen.on{display:flex}
.nav{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(var(--safeT) + 10px) 18px 10px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
}
.nav .ttl{font-size:15px;font-weight:600;letter-spacing:.02em;flex:1;text-align:center;margin:0 -32px}
.nav button.ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:17px;color:var(--fg);flex:none;z-index:1}
.nav button.ic:active{background:var(--soft)}
.body{flex:1;padding:22px 18px calc(var(--safeB) + 28px);max-width:720px;width:100%;margin:0 auto}
.body.withbar{padding-bottom:calc(var(--safeB) + 96px)}

/* ---------- home ---------- */
.brand{padding:11vh 0 7vh;text-align:center}
.brand h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:400;margin:0;letter-spacing:.04em}
.brand .rule{width:76px;height:1px;background:var(--fg);margin:14px auto 0}
.brand p{color:var(--fg3);font-size:12px;letter-spacing:.22em;margin:14px 0 0;text-transform:uppercase}
.menu{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:active{background:var(--soft)}
.item .n{font-family:Georgia,serif;font-size:12px;color:var(--fg3);width:20px;flex:none}
.item .t{flex:1}
.item .t b{display:block;font-size:17px;font-weight:600;letter-spacing:.01em}
.item .t s{display:block;font-size:12px;color:var(--fg3);text-decoration:none;margin-top:3px;letter-spacing:.04em}
.item .chev{color:var(--fg3);font-size:15px}
.item[disabled]{opacity:.32}
.badge{font-size:10px;border:1px solid var(--line2);color:var(--fg3);padding:1px 6px;border-radius:99px;margin-left:8px;vertical-align:2px}

/* ---------- cards / text ---------- */
.card{border:1px solid var(--line);border-radius:16px;padding:22px 20px;background:var(--bg);box-shadow:var(--sh)}
.sent{font-size:24px;line-height:1.62;font-weight:500;letter-spacing:.005em;word-break:break-word}
.w{cursor:pointer;border-bottom:1px solid transparent;padding:1px 0;border-radius:2px}
.w:active,.w.on{background:rgba(128,128,128,.18);border-bottom-color:var(--fg2)}
.tb{font-family:"Noto Serif Tibetan","Kailasa","Microsoft Himalaya",serif;font-size:26px;line-height:2.1}
.ar{font-family:"Noto Sans Arabic","Geeza Pro",serif;font-size:25px;line-height:2;direction:rtl;text-align:right}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.translit{font-size:14px;color:var(--fg2);letter-spacing:.02em;margin-top:10px;font-style:italic}
.trans{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line2);font-size:15px;color:var(--fg2);line-height:1.7}
.trans .en{margin-top:6px;font-size:14px;color:var(--fg3)}
.hint{color:var(--fg3);font-size:12.5px;letter-spacing:.03em}
.sec{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);margin:26px 0 10px}

/* ---------- buttons ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);border-radius:99px;padding:8px 16px;font-size:13.5px;letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:active{background:var(--soft)}
.btn.pri{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.pri:active{opacity:.75}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--soft);border-color:var(--fg2)}
.wide{width:100%;justify-content:center;padding:14px;border-radius:14px}
.split{display:flex;gap:8px}
.split .btn{flex:1;justify-content:center;padding:13px 8px;border-radius:13px;font-size:14px}

/* ---------- inputs ---------- */
.fld{width:100%;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;background:var(--bg);
  font-size:16px;outline:none;-webkit-appearance:none}
.fld:focus{border-color:var(--fg2)}
textarea.fld{line-height:1.65;resize:vertical;min-height:120px}
label.lb{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:20px 0 7px}
.note{font-size:12.5px;color:var(--fg3);margin-top:7px;line-height:1.55}

/* ---------- bottom ask bar ---------- */
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 14px calc(var(--safeB) + 10px);
  display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto}
.askbar textarea{flex:1;border:1px solid var(--line2);border-radius:20px;padding:10px 14px;font-size:16px;
  background:var(--bg);outline:none;resize:none;max-height:120px;line-height:1.45;min-height:41px}
.askbar .go{width:41px;height:41px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.askbar .go[disabled]{opacity:.3}

/* ---------- chat ---------- */
.qa{margin-top:14px;border-left:2px solid var(--line);padding-left:14px}
.qa .q{font-size:14px;color:var(--fg);font-weight:600;margin-top:16px}
.qa .a{font-size:14.5px;color:var(--fg2);line-height:1.75;white-space:pre-wrap;margin-top:6px}
.qa .a:first-child{margin-top:0}

/* ---------- word sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:90;display:none;backdrop-filter:blur(2px)}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--bg);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:86vh;overflow-y:auto;
  padding:12px 20px calc(var(--safeB) + 26px);transform:translateY(100%);
  transition:transform .24s cubic-bezier(.32,.72,0,1),visibility .24s;visibility:hidden;
  max-width:720px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0);visibility:visible}
.xbar{display:flex;justify-content:flex-end;margin:0 -4px 6px;position:sticky;top:-12px;
  background:var(--bg);padding:4px 0 6px;z-index:5}
.xb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.xb:active{background:var(--soft)}
.wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wh .ww{font-size:27px;font-weight:600}
.wh .lm{font-size:13px;color:var(--fg3)}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 7px;color:var(--fg2);letter-spacing:.04em}
.tag.k{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.def{font-size:16px;margin-top:12px;line-height:1.7}
.ex{background:var(--soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.65}
.ex s{display:block;text-decoration:none;color:var(--fg2);font-size:13.5px;margin-top:4px}
.forms{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.forms div{padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.forms div:last-child{border-bottom:none}
.forms div b{color:var(--fg3);font-weight:400;min-width:74px;flex:none;font-size:12.5px}
.expl{font-size:14.5px;color:var(--fg2);line-height:1.78;margin-top:14px;white-space:pre-wrap}
.wask{display:flex;gap:8px;align-items:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.wask textarea{flex:1;border:1px solid var(--line2);border-radius:20px;padding:10px 14px;font-size:16px;
  background:var(--bg);outline:none;resize:none;max-height:120px;line-height:1.45;min-height:41px}
.wask .go{width:41px;height:41px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}

/* first layer gloss */
.gl{font-size:20px;line-height:1.6;margin:16px 0 2px}
.gl .sub{color:var(--fg3);font-size:13px;margin-top:6px;font-style:italic}

/* tibetan: my pronunciation + recording */
.w{position:relative}
.w.has::after,.w.pron::after{content:"";position:absolute;left:50%;bottom:-5px;width:5px;height:5px;
  margin-left:-2.5px;border-radius:50%;background:var(--fg)}
.w.pron::after{background:none;border:1px solid var(--fg3);width:4px;height:4px;margin-left:-2px}
.bopn{margin-top:18px;border:1px solid var(--line2);border-radius:12px;padding:14px 15px;background:var(--soft)}
.bopn .hd{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);
  margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bopn .hd span{font-family:"Noto Serif Tibetan",serif;font-size:17px;color:var(--fg2);letter-spacing:0;text-transform:none}
.bopn .pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bopn .pv b{font-size:17px;font-weight:600;flex:1;min-width:120px;word-break:break-word}
.bopn .pv i{font-size:13px;color:var(--fg3);flex:1;min-width:120px}
.bopn textarea{background:var(--bg)}
.btn.rec{border-color:var(--fg);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* kazakh letter table */
.klt{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.klt .hd,.klt .rw{display:grid;grid-template-columns:38px 1fr 56px;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);align-items:center}
.klt .hd{background:var(--soft);color:var(--fg3);font-size:10.5px;letter-spacing:.1em}
.klt .rw:last-child{border-bottom:none}
.klt .cy{font-size:17px;font-weight:600}
.klt .fm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.klt .fm b{font-family:"Noto Sans Arabic","Geeza Pro",serif;font-weight:400;font-size:19px;line-height:1.6;
  border:1px solid var(--line);border-radius:6px;text-align:center;direction:rtl;color:var(--fg)}
.klt .fm b.na{color:var(--fg3);font-size:13px;font-family:inherit}
.klt .hd .fm span{text-align:center;font-size:10px;letter-spacing:0}
.klt .lt{text-align:right;color:var(--fg2);font-size:13px;font-style:italic}
.klt .nt{grid-column:1/-1;color:var(--fg3);font-size:12px;line-height:1.5;margin-top:-2px}

/* ---------- dialogue ---------- */
.msg{margin-bottom:20px;max-width:92%}
.msg.me{margin-left:auto}
.bub{border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:17px;line-height:1.6}
.msg.me .bub{background:var(--soft);border-color:var(--soft);border-bottom-right-radius:5px}
.msg.sys .bub{border-bottom-left-radius:5px}
.bub.veil{border-style:dashed;color:var(--fg3);font-size:14px;font-style:italic;letter-spacing:.04em}
.msg .tr{font-size:13.5px;color:var(--fg2);padding:9px 4px 0;line-height:1.6;display:none}
.msg .tr.on{display:block}
.msg .tr .e{color:var(--fg3);font-size:12.5px;margin-top:3px}
.msg .ctl{display:flex;gap:14px;padding:7px 6px 0;font-size:12px;color:var(--fg3)}
.fix{border:1px solid var(--line2);border-left:3px solid var(--fg);border-radius:10px;padding:12px 14px;
  margin:0 0 18px;font-size:14px;line-height:1.65;background:var(--soft)}
.fix b.h{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px;font-weight:400}
.fix .cor{display:flex;align-items:flex-start;gap:9px;font-size:16px;line-height:1.55;margin-bottom:8px}
.fix .cor span{flex:1}
.fix .nt{color:var(--fg2);font-size:13.5px;line-height:1.65}
.scene{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--fg2);
  line-height:1.65;margin-bottom:22px;background:var(--soft)}
.scene b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px;font-weight:400}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.swi{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:99px;
  padding:6px 14px 6px 10px;font-size:12.5px;color:var(--fg3)}
.swi .kn{width:32px;height:18px;border-radius:99px;background:var(--line2);position:relative;transition:.18s;flex:none}
.swi .kn i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:.18s}
.swi.on{color:var(--fg);border-color:var(--inv-bg)}
.swi.on .kn{background:var(--inv-bg)}
.swi.on .kn i{left:16px}

/* ---------- settings stepper ---------- */
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.stp .nm{flex:1}
.stp .nm b{font-size:15px;font-weight:600;display:block}
.stp .nm s{font-size:11.5px;color:var(--fg3);text-decoration:none;display:block;margin-top:3px;line-height:1.4}
.stp .ct{display:flex;align-items:stretch;flex:none}
.stp .ct button{width:34px;height:34px;border:1px solid var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--fg)}
.stp .ct button:active{background:var(--soft)}
.stp .ct button:first-child{border-radius:9px 0 0 9px}
.stp .ct button:last-child{border-radius:0 9px 9px 0;border-left:none}
.stp .ct .v{min-width:52px;text-align:center;font-size:12px;color:var(--fg2);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em}

/* ---------- card library ---------- */
.lib{border-top:1px solid var(--line)}
.lc{border-bottom:1px solid var(--line);padding:16px 2px}
.lc .top{display:flex;align-items:flex-start;gap:12px}
.lc .cb{width:21px;height:21px;border:1px solid var(--line2);border-radius:6px;flex:none;margin-top:3px;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.lc.done .cb{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.lc.done .fr{text-decoration:line-through;color:var(--fg3)}
.lc .fr{flex:1;font-size:16px;line-height:1.55;font-weight:500;word-break:break-word}
.lc .mt{font-size:11px;color:var(--fg3);margin-top:5px;letter-spacing:.06em}
.lc .acts{display:flex;gap:8px;margin-top:12px;padding-left:33px;flex-wrap:wrap}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--fg2);background:var(--soft);
  border-radius:10px;padding:13px;margin-top:11px;max-height:220px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lint{border:1px solid var(--line2);border-radius:10px;padding:11px 13px;margin-top:11px;font-size:12.5px;line-height:1.65;color:var(--fg2)}
.lint.bad{border-left:3px solid var(--fg)}
.lint b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.lint ul{margin:5px 0 0;padding-left:18px}
.lint li{margin:2px 0}
.rend{white-space:pre-wrap;font-size:14.5px;line-height:1.8;margin-top:11px;border:1px solid var(--line);
  border-radius:10px;padding:15px}
.rend hr{border:none;border-top:1px solid var(--fg3);margin:14px 0}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--fg3);padding:16vh 20px;font-size:14px;line-height:1.9}
.empty .big{font-family:Georgia,serif;font-size:34px;color:var(--line2);display:block;margin-bottom:14px}
.load{display:inline-flex;gap:4px;align-items:center;color:var(--fg3);font-size:13px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--fg3);animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:1}}
.err{border:1px solid var(--line2);border-left:3px solid var(--fg);border-radius:8px;padding:12px 14px;
  font-size:13px;color:var(--fg2);margin:14px 0;line-height:1.6;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--safeB) + 84px);
  background:var(--inv-bg);color:var(--inv-fg);padding:11px 20px;border-radius:99px;font-size:13.5px;z-index:200;
  opacity:0;transition:.22s;pointer-events:none;display:flex;gap:14px;align-items:center;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto}
.toast button{color:var(--inv-fg);text-decoration:underline;font-size:13.5px;white-space:nowrap;pointer-events:auto}
.spacer{height:12px}
</style>

<body>
<div id="app"></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= Yulengua · core ================= */
'use strict';

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const CFG_DEFAULT = {
  key: '', model: 'gpt-4.1', azKey: '', azReg: 'westeurope',
  diff: {},         // 每种语言的难度微调，整数，0 = 基准
  boPron: '',       // 用户自定义的安多话注音标准（样例对照表）
  autoSpeak: false, // 场景对话自动朗读
  cardCap: 0,       // 卡片上限，0 = 不限；超出时只回收已勾选「已添加」的旧卡片
  lastBackup: 0,    // 上次导出备份的时间戳
  cfgTs: 0,         // 设置最后一次修改的时间戳（云端合并用）
  lastCloud: 0,     // 上次云端同步成功的时间戳
  oss: null         // 阿里云 OSS：{ep,bucket,ak,sk,on,cache}。AccessKey 只存本机
};
const S = {
  cfg: Object.assign({}, CFG_DEFAULT, LS.get('lg.cfg', {})),
  cards: [],
  seen: {},         // 每种语言最近读过的句子（难度基准线）
  bo: {},           // 藏语发音库：归一化词 -> {w,p 注音,h 音频哈希,x 扩展名,ts}
  trash: null,
  stack: [],
  store: 'ls'       // 'idb' | 'ls'
};
if (!S.cfg.diff || typeof S.cfg.diff !== 'object') S.cfg.diff = {};

/* ---------------- 本地存储：IndexedDB 为主，localStorage 兜底 ----------------
   iPhone 上两者都存在设备本地、不上云。选 IndexedDB 是因为 localStorage 在
   WebKit 上只有约 5 MB，而 IndexedDB 的配额是磁盘容量的一个百分比，且可以
   通过 navigator.storage.persist() 申请「持久化」，从而免于系统的存储回收。 */
const DB_NAME = 'yulengua', DB_STORE = 'kv';
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no-idb')); return; }

async function loadAll() {
  try { await openDB(); S.store = 'idb'; } catch (e) { S.store = 'ls'; }

  if (S.store === 'idb') {
    try {
      const cfg = await idbGet('cfg');
      const cards = await idbGet('cards');
      const seen = await idbGet('seen');
      const bo = await idbGet('bo');
      if (bo && typeof bo === 'object') S.bo = bo;
      if (cfg) S.cfg = Object.assign({}, CFG_DEFAULT, cfg);
      if (!S.cfg.diff || typeof S.cfg.diff !== 'object') S.cfg.diff = {};

      if (Array.isArray(cards)) S.cards = cards;
      else {                                    // 首次运行：从 localStorage 迁移
        const old = LS.get('lg.cards', null);
        S.cards = Array.isArray(old) ? old : [];
        await idbSet('cards', S.cards);
      }
      if (seen && typeof seen === 'object') S.seen = seen;
      else {
        const o = {};
        LK.forEach(k => { const v = LS.get('lg.seen.' + k, null); if (Array.isArray(v)) o[k] = v; });
        S.seen = o;
        await idbSet('seen', o);
      }
      if (!cfg) await idbSet('cfg', S.cfg);
      /* 迁移完成后清掉 localStorage 里的大块数据，把那 5 MB 让出来 */
      try {
        localStorage.removeItem('lg.cards');
        LK.forEach(k => localStorage.removeItem('lg.seen.' + k));
      } catch (e) {}
    } catch (e) { S.store = 'ls'; }
  }
  if (S.store === 'ls') {
    S.cards = LS.get('lg.cards', []);

  }

  if (!S.seen || typeof S.seen !== 'object') S.seen = {};
  if (!S.bo || typeof S.bo !== 'object') S.bo = {};

}

  const cap = S.cfg.cardCap | 0;
  if (!cap || S.cards.length <= cap) return 0;
  let over = S.cards.length - cap, removed = 0;

    if (S.cards[i].added) { S.cards.splice(i, 1); over--; removed++; }

}

/* ================= 墨墨记忆卡语法检查与自动修复 =================
   规则来自墨墨官方语法文档：
   [T#样式#内容]  样式可组合：B 粗 / U 下划线 / I 斜 / D 删除线 / up 上标 / down 下标
                  / !rrggbb 字色 / !!rrggbb 背景色，用逗号分隔
   [F##内容]      文字挖空
   [P#样式#内容]  段落， [Pic#ID/xx#] 图片， [Audio#A,ID/xx#] 音频
   [E##LaTeX]     公式， [Card#ID/xx#文字] 卡片引用
   ---            答案线，单卡最多 9 条
   关键坑：标记内容里出现 ] 会提前终止标记；标记不能跨行；不支持 markdown。 */
const MJ_TYPES = 'T|P|F|Pic|Audio|E|Choice|Card';
const MJ_STYLE_WORD = /^(B|U|I|D|up|down)$/;
const MJ_STYLE_COLOR = /^!!?[0-9a-fA-F]{3,8}$/;
const MJ_STYLE_LINK = /^link\/".*"$/;

function markjiLint(src) {
  let t = String(src == null ? '' : src);
  const fixed = [], warn = [];

  /* 1. markdown 残留 —— 墨墨不认 markdown */
  if (/^\s*```/m.test(t)) { t = t.replace(/^\s*```.*$/gm, ''); fixed.push('删掉了 ``` 代码围栏'); }
  if (/^\s{0,3}#{1,6}\s+\S/m.test(t)) { t = t.replace(/^(\s{0,3})#{1,6}\s+/gm, '$1'); fixed.push('去掉了 markdown 标题的 #'); }
  if (/\*\*[^*\n]+\*\*/.test(t)) { t = t.replace(/\*\*([^*\n]+)\*\*/g, '[T#B#$1]'); fixed.push('把 **加粗** 换成了 [T#B#…]'); }

  /* 2. 逐个标记检查 */
  const open = new RegExp('\\[(' + MJ_TYPES + ')#', 'g');
  let m, out = '', last = 0;
  while ((m = open.exec(t))) {
    const start = m.index, type = m[1], bodyFrom = m.index + m[0].length;
    const close = t.indexOf(']', bodyFrom);
    const nl = t.indexOf('\n', bodyFrom);

    if (close === -1 || (nl !== -1 && nl < close)) {   // 未闭合或跨行
      const end = nl === -1 ? t.length : nl;
      out += t.slice(last, end) + ']';
      last = end;
      fixed.push('补上了未闭合的 [' + type + '#…');
      open.lastIndex = end;
      continue;
    }

    let body = t.slice(bodyFrom, close);
    let style = '', content = body;
    if (type === 'T' || type === 'P' || type === 'F' || type === 'E' || type === 'Choice') {
      const hash = body.indexOf('#');
      if (hash === -1) {
        warn.push('[' + type + '#' + body.slice(0, 20) + '] 缺少第二个 #，格式应为 [' + type + '#样式#内容]');
        out += t.slice(last, close + 1); last = close + 1; continue;
      }
      style = body.slice(0, hash);
      content = body.slice(hash + 1);
    }

    let newStyle = style, changed = false;
    if (type === 'T' || type === 'P') {
      const toks = style.split(',').filter(x => x !== '');
      const okToks = [];
      toks.forEach(tk => {
        if (MJ_STYLE_WORD.test(tk) || MJ_STYLE_LINK.test(tk) || /^(H1|H2|H3|center|right|L)$/.test(tk)) { okToks.push(tk); return; }
        if (MJ_STYLE_COLOR.test(tk)) {
          const bang = tk.startsWith('!!') ? '!!' : '!';
          let hex = tk.slice(bang.length);
          if (hex.length === 3) { hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; changed = true; }
          if (hex.length === 8) { hex = hex.slice(0, 6); changed = true; }
          if (hex.length !== 6) { warn.push('颜色值 ' + tk + ' 不是 6 位十六进制'); okToks.push(tk); return; }
          okToks.push(bang + hex.toLowerCase());
          if (hex !== hex.toLowerCase()) changed = true;
          return;
        }
        warn.push('样式 “' + tk + '” 不是墨墨支持的写法（可用 B/U/I/D/up/down/!色值/!!色值）');
        okToks.push(tk);
      });
      newStyle = okToks.join(',');
      if (newStyle !== style) changed = true;
    }

    if (!content.trim() && type !== 'Pic' && type !== 'Audio') {
      warn.push('[' + type + '#' + style + '#] 里没有内容');
    }

    out += t.slice(last, start) + '[' + type + '#' + (type === 'F' ? '#' : (style === body ? '' : newStyle + '#')) + content + ']';
    if (changed) fixed.push('修正了颜色/样式写法');
    last = close + 1;
    open.lastIndex = close + 1;
  }
  out += t.slice(last);
  t = out;

  /* 3. 内容里裸露的 ] —— 会提前截断标记 */
  const strays = [];
  t.split('\n').forEach((line, i) => {
    let depth = 0;
    for (let c = 0; c < line.length; c++) {
      if (line[c] === '[') depth++;
      else if (line[c] === ']') { if (depth === 0) strays.push(i + 1); else depth--; }
    }
    if (depth > 0) strays.push(i + 1);
  });
  if (strays.length) warn.push('第 ' + Array.from(new Set(strays)).join('、') + ' 行有多余或不配对的方括号，墨墨会在这里提前截断标记');

  /* 4. 答案线：墨墨单卡最多 9 条；本应用的卡片只应有 1 条 */
  const lines = t.split('\n');
  let seen = 0, extra = 0;
  for (let i = 0; i < lines.length; i++) {
    if (/^---[ \t]*$/.test(lines[i])) {
      seen++;
      if (seen > 1) { lines[i] = '———'; extra++; }
    }
  }
  if (extra) { t = lines.join('\n'); fixed.push('把多出来的 ' + extra + ' 条答案线改成了普通分隔线（墨墨会把每条 --- 当成一个答案面）'); }

  return { text: t, fixed: fixed, warn: warn, ok: warn.length === 0 };
}

function copyText(txt) {

  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 999999);

/* ---------------- router ---------------- */
function go(view, arg, replace) {
  if (!replace) S.stack.push({ view, arg });
  else S.stack[S.stack.length - 1] = { view, arg };
  render();
}
function back() {
  closeSheet();
  if (S.stack.length > 1) { S.stack.pop(); render(); }
}
function home() { closeSheet(); S.stack = [{ view: 'home' }]; render(); }

const VIEWS = {};
function render() {
  const cur = S.stack[S.stack.length - 1];
  closeSheet();
  window.scrollTo(0, 0);
  VIEWS[cur.view](cur.arg);
}

function nav(title, rightHtml) {
  const showBack = S.stack.length > 1;
  return '<div class="nav">' +
    (showBack ? '<button class="ic" onclick="back()">&#8249;</button>' : '<span style="width:32px"></span>') +
    '<div class="ttl">' + esc(title) + '</div>' +
    (rightHtml || '<span style="width:32px"></span>') +
    '</div>';
}
function shell(title, bodyHtml, opts) {
  opts = opts || {};
  app().innerHTML = '<div class="screen on">' + nav(title, opts.right) +
    '<div class="body' + (opts.bar ? ' withbar' : '') + '">' + bodyHtml + '</div></div>' + (opts.bar || '');
}

/* ---------------- speech ---------------- */
let voicesReady = false;
function loadVoices() { try { speechSynthesis.getVoices(); voicesReady = true; } catch (e) {} }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

/* 合成好的音频只留在内存里，上限 30 条，超出就回收最早的，不占设备存储 */
const audioCache = new Map();
function cacheAudio(ck, url) {
  audioCache.set(ck, url);
  while (audioCache.size > 30) {
    const first = audioCache.keys().next().value;
    try { URL.revokeObjectURL(audioCache.get(first)); } catch (e) {}
    audioCache.delete(first);
  }
}

function pickVoice(code) {
  const vs = speechSynthesis.getVoices() || [];
  const base = code.split('-')[0];
  return vs.find(v => v.lang && v.lang.replace('_', '-') === code)
      || vs.find(v => v.lang && v.lang.toLowerCase().indexOf(base) === 0)
      || null;
}
function nativeSpeak(text, code, rate) {
  if (!window.speechSynthesis) { toast('本设备不支持语音'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = code; u.rate = rate || 0.92;
  const v = pickVoice(code); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---- iOS 自动播放解锁：必须在用户手势里同步调用一次 ---- */
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
let audioEl = null, audioUnlocked = false;
function primeAudio() {
  if (!audioEl) {
    audioEl = new Audio();
    audioEl.setAttribute('playsinline', '');
    audioEl.preload = 'auto';
  }
  if (!audioUnlocked) {
    audioUnlocked = true;
    try { audioEl.src = SILENT_WAV; const p = audioEl.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  return audioEl;
}
function playUrl(url) {
  const el = primeAudio();
  el.src = url;
  try {
    const p = el.play();
    if (p && p.catch) p.catch(() => toast('浏览器拦截了自动播放，请再点一次发音'));
  } catch (e) { toast('播放失败'); }
}

/* ---- Azure Speech SDK（浏览器端唯一受支持的方式，走 WebSocket，不受跨域限制）---- */
const AZ_VOICE = 'kk-KZ-AigulNeural';
const SDK_URLS = [
  'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js',
  'https://unpkg.com/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'
];
let sdkPromise = null;
function loadSpeechSDK() {
  if (window.SpeechSDK) return Promise.resolve(window.SpeechSDK);
  if (sdkPromise) return sdkPromise;
  sdkPromise = new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= SDK_URLS.length) { sdkPromise = null; reject(new Error('SDK_LOAD')); return; }
      const s = document.createElement('script');
      s.src = SDK_URLS[i++]; s.async = true;
      s.onload = () => { if (window.SpeechSDK) resolve(window.SpeechSDK); else tryNext(); };
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
  return sdkPromise;
}

const normReg = r => String(r || 'westeurope').trim().toLowerCase().replace(/\s+/g, '');

async function azureSynth(text) {
  const SDK = await loadSpeechSDK();
  const cfg = SDK.SpeechConfig.fromSubscription((S.cfg.azKey || '').trim(), normReg(S.cfg.azReg));
  cfg.speechSynthesisVoiceName = AZ_VOICE;
  cfg.speechSynthesisOutputFormat = SDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
  const syn = new SDK.SpeechSynthesizer(cfg, null);   // null = 不自动播放，只拿音频数据
  try {
    const res = await new Promise((resolve, reject) => {
      syn.speakTextAsync(text, resolve, e => reject(new Error(String(e))));
    });
    if (res.reason === SDK.ResultReason.SynthesizingAudioCompleted && res.audioData && res.audioData.byteLength) {
      return new Blob([res.audioData], { type: 'audio/mpeg' });
    }
    throw new Error(res.errorDetails || ('合成未完成（reason ' + res.reason + '）'));
  } finally { try { syn.close(); } catch (e) {} }
}

function azureHint(msg) {
  const m = String(msg || '');
  if (/SDK_LOAD/.test(m)) return '语音组件没能从 CDN 加载。检查网络后重试。';
  if (/401|Unauthorized/i.test(m)) return 'Key 与区域对不上。最常见原因：区域填错了。请到 Azure 门户打开你的 Speech 资源，看「位置」写的是什么，去掉空格全部小写填进来（West Europe → westeurope）。';
  if (/1006|WebSocket|ConnectionFailure|ENOTFOUND|getaddrinfo/i.test(m))
    return '连不上 Azure。多半是区域代码拼错了（会解析到一个不存在的域名），也可能是网络被拦截。';
  if (/403|Forbidden/i.test(m)) return '被拒绝：资源可能已停用、超出免费额度，或该区域不提供 kk-KZ 音色（建议用 westeurope 或 eastus）。';
  if (/429|TooManyRequests|Quota/i.test(m)) return '超出配额或请求过于频繁，稍后再试。';
  if (/400/.test(m)) return '请求被拒（400）：通常是区域字符串里混入了空格或多余字符。';
  return m || '未知错误';
}

/* Kazakh: Azure -> OpenAI TTS -> iOS 俄语音色（最后兜底） */
async function apiSpeak(text, btn) {
  primeAudio();                                  // 必须在手势里同步执行
  const ck = 'kk|' + text;
  if (audioCache.has(ck)) { playUrl(audioCache.get(ck)); return; }
  const old = btn ? btn.innerHTML : null;
  if (btn) { btn.innerHTML = '···'; btn.disabled = true; }
  try {
    let blob = null, why = '';
    if ((S.cfg.azKey || '').trim()) {
      try { blob = await azureSynth(text); }
      catch (e) { why = azureHint(e.message); }
    }
    if (!blob && (S.cfg.key || '').trim()) {
      try { blob = await openaiTTS(text); } catch (e) { if (!why) why = 'OpenAI 语音失败 · ' + e.message; }
    }
    if (blob) {
      const url = URL.createObjectURL(blob);
      cacheAudio(ck, url);
      playUrl(url);
      if (why) toast('Azure 失败，已改用 OpenAI 语音 · ' + why);
    } else {
      nativeSpeak(text, 'ru-RU', 0.85);
      toast(why || '未配置语音，已用俄语音色近似朗读');
    }
  } finally { if (btn) { btn.innerHTML = old; btn.disabled = false; } }
}
async function openaiTTS(text) {
  const r = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + S.cfg.key.trim(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'gpt-4o-mini-tts', voice: 'alloy', input: text, speed: 0.92 })
  });
  if (!r.ok) throw new Error('openai tts ' + r.status);
  return await r.blob();
}

function say(lang, text, btn) {
  const L = LANGS[lang];
  if (!L || !L.tts) { toast('该语言暂无可用语音'); return; }
  if (L.tts === 'api') apiSpeak(text, btn);
  else nativeSpeak(text, L.tts);
}
window.say = say;

/* ================= Yulengua · 阿里云 OSS 云端存储 =================
   浏览器端直接调用 OSS REST API，用 V4 签名（OSS4-HMAC-SHA256）。
   签名算法与官方 ali-oss 的 signUtils.authorizationV4 逐字节对齐，
   并在构建期做过定点对拍。AccessKey 只存本机，绝不写入云端对象。 */

const OSS_DEFAULT = {
  ep: 'oss-eu-central-1.aliyuncs.com',   // 地域 Endpoint（不带 bucket 前缀）
  bucket: '',
  ak: '', sk: '',
  on: false,          // 是否启用云端
  cache: true         // 是否在本机缓存已下载的音频
};

/* ---------- 低层工具 ---------- */
const te = new TextEncoder();
function hex(buf) {
  const b = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
  return s;
}
function subtle() {
  const c = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle : null;
  if (!c) throw new Error('NO_CRYPTO');
  return c;
}
async function sha256hex(str) {
  return hex(await subtle().digest('SHA-256', te.encode(str)));
}
async function hmacRaw(keyBytes, msg) {
  const k = await subtle().importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await subtle().sign('HMAC', k, te.encode(msg)));
}

/* URI 编码：与 ali-oss 的 encodeString 一致（保留 / 不编码） */
function ossEnc(s) {
  return encodeURIComponent(String(s == null ? '' : s))
    .replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
}
const ossEncPath = s => ossEnc(s).replace(/%2F/g, '/');

/* ---------- 配置读取 ---------- */
function ossCfg() { return Object.assign({}, OSS_DEFAULT, S.cfg.oss || {}); }
function ossHostname() {
  const o = ossCfg();
  const ep = String(o.ep || '').trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
  return { ep: ep, host: o.bucket ? o.bucket + '.' + ep : ep };
}
/* oss-eu-central-1.aliyuncs.com -> eu-central-1 */
function ossRegion() {
  const ep = ossHostname().ep;
  const m = /^oss-([a-z0-9-]+?)(?:-internal)?\.aliyuncs\.com$/i.exec(ep);
  return m ? m[1].toLowerCase() : ep.replace(/^oss-/, '').replace(/\..*$/, '').toLowerCase();
}
function ossReady() {
  const o = ossCfg();
  return !!(o.on && o.bucket && o.ak && o.sk && ossHostname().ep);
}

/* ---------- V4 签名 ---------- */
function ossStamp(d) {
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + 'T' +
    p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + 'Z';
}

/* headers：只含参与签名的头（content-type / content-md5 / x-oss-*），全部小写 */
async function ossAuth(method, bucket, key, query, headers, region, ak, sk, stamp) {
  const names = Object.keys(headers).map(h => h.toLowerCase()).sort();
  const canonHeaders = names.map(n => n + ':' + String(headers[n]).trim() + '\n').join('');
  const qs = Object.keys(query || {}).sort((a, b) => a.localeCompare(b))
    .map(k => query[k] === null ? ossEnc(k) : ossEnc(k) + '=' + ossEnc(query[k])).join('&');

  const canonReq = [
    method.toUpperCase(),
    ossEncPath('/' + (bucket ? bucket + '/' : '') + (key || '')),
    qs,
    canonHeaders,
    '',
    headers['x-oss-content-sha256'] || 'UNSIGNED-PAYLOAD'
  ].join('\n');

  const day = stamp.slice(0, 8);
  const scope = day + '/' + region + '/oss/aliyun_v4_request';
  const sts = ['OSS4-HMAC-SHA256', stamp, scope, await sha256hex(canonReq)].join('\n');

  let k = await hmacRaw(te.encode('aliyun_v4' + sk), day);
  k = await hmacRaw(k, region);
  k = await hmacRaw(k, 'oss');
  k = await hmacRaw(k, 'aliyun_v4_request');
  const sig = hex(await hmacRaw(k, sts));

  return 'OSS4-HMAC-SHA256 Credential=' + ak + '/' + scope + ',Signature=' + sig;
}

/* ---------- 请求 ---------- */
function ossErrFrom(status, xml) {
  const code = (/<Code>([^<]+)<\/Code>/.exec(xml || '') || [])[1] || ('HTTP_' + status);
  const msg = (/<Message>([^<]+)<\/Message>/.exec(xml || '') || [])[1] || '';
  const e = new Error(code + (msg ? ' · ' + msg : ''));
  e.code = code; e.status = status;
  return e;
}

/* method: GET/PUT/DELETE/HEAD；body 可为 Blob/字符串/null */
async function ossReq(method, key, body, contentType, opt) {
  const o = ossCfg();
  if (!o.bucket) throw new Error('未填写 Bucket 名称');
  if (!o.ak || !o.sk) throw new Error('未填写 AccessKey');
  const { host } = ossHostname();
  const stamp = ossStamp(new Date());
  const sign = { 'x-oss-content-sha256': 'UNSIGNED-PAYLOAD', 'x-oss-date': stamp };
  if (contentType) sign['content-type'] = contentType;

  /* opt.ak / opt.sk / opt.noAuth 只给诊断用，正常调用一律走配置里的凭证 */
  const headers = Object.assign({}, sign);
  if (!(opt && opt.noAuth)) {
    const ak = ((opt && opt.ak) || o.ak).trim();
    const sk = ((opt && opt.sk) || o.sk).trim();
    headers.authorization = await ossAuth(method, o.bucket, key, null, sign, ossRegion(), ak, sk, stamp);
  }

  let r;
  try {
    r = await fetch('https://' + host + '/' + ossEncPath(key), {
      method: method, headers: headers, body: body || undefined, mode: 'cors', cache: 'no-store'
    });
  } catch (e) {
    const err = new Error('网络或跨域被拦截');
    err.code = 'CORS_OR_NETWORK';
    throw err;
  }
  if (!r.ok) {
    let xml = '';
    try { xml = await r.text(); } catch (e) {}
    throw ossErrFrom(r.status, xml);
  }
  return r;
}

const ossPutText = (key, text) => ossReq('PUT', key, new Blob([text], { type: 'application/json' }), 'application/json');
const ossPutBlob = (key, blob, ct) => ossReq('PUT', key, blob, ct || blob.type || 'application/octet-stream');
async function ossGetText(key) { return (await ossReq('GET', key)).text(); }
async function ossGetBlob(key) { return (await ossReq('GET', key)).blob(); }
const ossDel = key => ossReq('DELETE', key);

/* fetch 失败时浏览器不会告诉脚本「是跨域还是网络」，所以自己探一下：
   no-cors 请求不受 CORS 规则约束，只要 DNS 和网络通就能 resolve（哪怕返回 403）。
   它成功而正常请求失败 => 一定是 CORS 规则的问题。 */
async function ossProbe() {
  const { host } = ossHostname();
  try {
    await fetch('https://' + host + '/?probe=1', { method: 'GET', mode: 'no-cors', cache: 'no-store' });
    return 'cors';
  } catch (e) { return 'net'; }
}

/* AccessDenied 有两种完全不同的成因，返回的文案却一样：
   (a) OSS 压根没认你的签名，把你当匿名访客，撞在私有 Bucket 的 ACL 上；
   (b) OSS 认出了你是谁，但这个 RAM 子用户没被授权。
   靠故意发几个「错得有特征」的请求就能分开：如果 OSS 能分别回出
   InvalidAccessKeyId 和 SignatureDoesNotMatch，说明它确实在读 Authorization
   头、你的 AccessKey 也是真实存在的，那问题就只可能是授权没配上。 */
async function ossAuthDiag(key) {
  const o = ossCfg();
  const probe = async opt => {
    try {
      await ossReq('PUT', key, new Blob(['probe'], { type: 'text/plain' }), 'text/plain', opt);
      ossDel(key).catch(() => {});
      return 'OK';
    } catch (e) { return (e && e.code) || 'ERR'; }
  };
  return {
    badId: await probe({ ak: 'LTAInotarealaccesskey', sk: o.sk }),
    badSecret: await probe({ ak: o.ak, sk: (o.sk || '') + 'x' }),
    anon: await probe({ noAuth: true })
  };
}

function ossAuthDiagHtml(d) {
  const reads = d.badId === 'InvalidAccessKeyId' || d.badSecret === 'SignatureDoesNotMatch';
  const raw = '<div class="note" style="margin-top:10px">探针结果：伪造 ID → ' + esc(d.badId) +
    '；错误密钥 → ' + esc(d.badSecret) + '；完全不带签名 → ' + esc(d.anon) + '</div>';

  if (d.anon === 'OK') {
    return '<div class="err" style="margin:10px 0 0"><b>诊断结果：这个 Bucket 是公共读写的！</b>' +
      '<div class="note" style="margin-top:8px">不带任何签名都能写进去，说明读写权限没设成「私有」。' +
      '请立刻到 Bucket → 权限管理 → 读写权限，改成<b>私有</b>。</div>' + raw + '</div>';
  }

  if (reads) {
    return '<div class="err" style="margin:10px 0 0"><b>诊断结果：AccessKey 是真实有效的，OSS 也确实读到了你的签名。' +
      '问题出在 RAM 授权 —— 这个子用户没有被授予操作这个 Bucket 的权限。</b>' +
      '<div class="note" style="margin-top:8px">到 <b>ram.console.aliyun.com</b> → 身份管理 → 用户 → 点开你建的那个子用户 → <b>权限管理</b> 标签页，按顺序核对：' +
      '<br><br>1. 这一页<b>是不是空的</b>？最常见的情况就是策略建好了、但那一步「添加权限」没做完（或者被那个黄色告警吓退了）。' +
      '<br>2. 如果有策略，点开看它的 Resource 写的 bucket 名，和这里填的 <b>' + esc(ossCfg().bucket) + '</b> 是否<b>逐字一致</b>（大小写、有没有多余的前缀目录）。' +
      '<br>3. 授权范围要选<b>账号级别</b>，不是某个资源组。选了资源组的话策略是挂上了，但对 OSS 不生效。' +
      '<br>4. 确认这对 AccessKey 属于<b>这个子用户</b>本人 —— 如果你先后建过好几个用户或者重新生成过 Key，很容易拿错。' +
      '<br><br>还有一种情况：Bucket 里配了「Bucket Policy」或防盗链，把请求挡在 RAM 之外。到 Bucket → 权限管理 里看一眼有没有多余的规则。</div>' + raw + '</div>';
  }

  return '<div class="err" style="margin:10px 0 0"><b>诊断结果：OSS 似乎没有在处理你的 Authorization 头，' +
    '把这次请求当成了匿名访问，撞在私有 Bucket 的 ACL 上。</b>' +
    '<div class="note" style="margin-top:8px">这种情况少见。请检查：跨域设置里的<b>允许 Headers 必须是 *</b>（不能只列几个）；' +
    '以及 Endpoint 有没有被写成带 bucket 前缀的形式（这里只该填 <b>oss-地域.aliyuncs.com</b>，不要带 ' + esc(ossCfg().bucket) + '. 前缀）。</div>' + raw + '</div>';
}

function ossHint(e) {
  const c = (e && e.code) || '';
  if (c === 'CORS_OR_NETWORK')
    return '浏览器把请求拦下了：可能是跨域规则（CORS），也可能是网络不通。点下面的「诊断」看是哪一种。';
  if (c === 'NO_CRYPTO') return '当前页面不是 https，浏览器禁用了加密接口，无法签名。请用 https 打开。';
  if (c === 'AccessDenied') return '被 OSS 拒绝了。这条错误本身分不清是「签名没被认」还是「授权没配上」，下面自动判断。';
  if (c === 'SignatureDoesNotMatch') return '签名不匹配：AccessKey Secret 多半复制时带了空格或缺字符。也可能是手机时间不准（签名有效期 15 分钟）。';
  if (c === 'InvalidAccessKeyId') return 'AccessKey ID 不存在或子用户已被停用。';
  if (c === 'NoSuchBucket') return '这个 Bucket 不存在，或 Endpoint 的地域和 Bucket 所在地域对不上。';
  if (c === 'RequestTimeTooSkewed') return '手机时间和服务器差得太远，去系统设置里打开「自动设置时间」。';
  if (c === 'NoSuchKey') return '云端还没有这个文件。';
  return (e && e.message) || '未知错误';
}

/* ---------- 音频对象 ---------- */
const MIME_EXT = { 'audio/mp4': 'm4a', 'audio/aac': 'm4a', 'audio/mpeg': 'mp3', 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/wav': 'wav' };
function extOf(mime) {
  const base = String(mime || '').split(';')[0].trim().toLowerCase();
  return MIME_EXT[base] || 'bin';
}
async function hashKey(s) { return (await sha256hex(String(s))).slice(0, 20); }
const audioKey = rec => 'audio/' + rec.h + '.' + (rec.x || 'm4a');

/* 本机音频缓存（IndexedDB，key 前缀 au:） */
const auCacheGet = h => (S.store === 'idb' ? idbGet('au:' + h).catch(() => null) : Promise.resolve(null));
const auCacheSet = (h, blob) => (S.store === 'idb' ? idbSet('au:' + h, blob).catch(() => {}) : Promise.resolve());
const auCacheDel = h => (S.store === 'idb' ? idb('readwrite', st => { st.delete('au:' + h); }).catch(() => {}) : Promise.resolve());

const auUrls = new Map();
async function audioUrl(rec) {
  if (!rec || !rec.h) return null;
  if (auUrls.has(rec.h)) return auUrls.get(rec.h);
  let blob = await auCacheGet(rec.h);
  if (!blob) {
    if (!ossReady()) throw new Error('云端未启用，本机也没有这段录音');
    blob = await ossGetBlob(audioKey(rec));
    if (ossCfg().cache) auCacheSet(rec.h, blob);
  }
  const url = URL.createObjectURL(blob);
  auUrls.set(rec.h, url);
  return url;
}

/* ---------- 藏语发音库 ---------- */
/* 键归一化：去掉尾部的音节点 ་ 与句点 །/༎，去空白 */
function boKey(w) {
  return String(w == null ? '' : w).replace(/[\s་༌།༎]+$/g, '').replace(/^[\s་]+/, '').trim();
}
const boGet = w => { const k = boKey(w); const e = S.bo && S.bo[k]; return (e && !e.del) ? e : null; };
function boSet(w, patch) {
  const k = boKey(w);
  if (!k) return null;
  const e = Object.assign({ w: k, p: '', h: '', x: '', ts: 0 }, S.bo[k] || {}, patch);
  e.w = k; e.ts = Date.now(); delete e.del;
  S.bo[k] = e; saveBo();
  return e;
}
function boDrop(w) {
  const k = boKey(w);
  const e = S.bo[k];
  if (!e) return;
  if (e.h) { auCacheDel(e.h); if (ossReady()) ossDel(audioKey(e)).catch(() => {}); }
  S.bo[k] = { w: k, del: true, ts: Date.now() };
  saveBo();
}
const boCount = () => Object.keys(S.bo || {}).filter(k => S.bo[k] && !S.bo[k].del).length;
const boList = () => Object.keys(S.bo || {}).map(k => S.bo[k])
  .filter(e => e && !e.del).sort((a, b) => (b.ts || 0) - (a.ts || 0));

/* 音节切分，用于「覆盖新音节才入选」的挑选 */
const boSyls = w => String(w || '').split(/[་༌།༎\s]+/).filter(Boolean);

/* ---------- data.json 同步 ---------- */
const CLOUD_KEY = 'data.json';
const CLOUD = { state: 'off', msg: '', last: 0, busy: false };

function cloudSnapshot() {
  return {
    app: 'yulengua', v: 2, ts: Date.now(),
    cards: S.cards, seen: S.seen, bo: S.bo,
    cfg: {
      ts: S.cfg.cfgTs || 0,
      boPron: S.cfg.boPron, diff: S.cfg.diff,
      cardCap: S.cfg.cardCap, autoSpeak: S.cfg.autoSpeak
    }
  };
}

/* 合并：一律以时间戳新的一方为准，不会因为换设备而丢东西 */
function cloudMerge(rm) {
  let changed = false;
  if (Array.isArray(rm.cards)) {
    const m = new Map();
    S.cards.forEach(c => m.set(c.lang + '|' + c.front, c));
    rm.cards.forEach(c => {
      if (!c || !c.front) return;
      const id = c.lang + '|' + c.front, mine = m.get(id);
      if (!mine) { m.set(id, c); changed = true; }
      else if ((c.ts || 0) > (mine.ts || 0)) { m.set(id, c); changed = true; }
    });
    const merged = Array.from(m.values()).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    if (merged.length !== S.cards.length || changed) { S.cards = merged; changed = true; }
  }
  if (rm.bo && typeof rm.bo === 'object') {
    Object.keys(rm.bo).forEach(k => {
      const r = rm.bo[k], mine = S.bo[k];
      if (!r) return;
      if (!mine || (r.ts || 0) > (mine.ts || 0)) { S.bo[k] = r; changed = true; }
    });
  }
  if (rm.seen && typeof rm.seen === 'object') {
    LK.forEach(k => {
      const a = Array.isArray(rm.seen[k]) ? rm.seen[k] : [];
      if (!a.length) return;
      const mine = Array.isArray(S.seen[k]) ? S.seen[k] : [];
      const set = new Set(mine);
      const add = a.filter(x => !set.has(x));
      if (add.length) { S.seen[k] = mine.concat(add).slice(-40); changed = true; }
    });
  }
  if (rm.cfg && (rm.cfg.ts || 0) > (S.cfg.cfgTs || 0)) {
    if (typeof rm.cfg.boPron === 'string') S.cfg.boPron = rm.cfg.boPron;
    if (rm.cfg.diff && typeof rm.cfg.diff === 'object') S.cfg.diff = rm.cfg.diff;
    if (typeof rm.cfg.cardCap === 'number') S.cfg.cardCap = rm.cfg.cardCap;
    if (typeof rm.cfg.autoSpeak === 'boolean') S.cfg.autoSpeak = rm.cfg.autoSpeak;
    S.cfg.cfgTs = rm.cfg.ts;
    saveCfg(true);
    changed = true;
  }
  if (changed) { saveCards(); saveSeen(); saveBo(true); }
  return changed;
}

/* 断网时录的音会先躺在本机，等下一次同步补传 */
async function cloudPushPending() {
  const pend = Object.keys(S.bo || {}).map(k => S.bo[k])
    .filter(e => e && !e.del && e.h && e.up === false);
  for (const e of pend) {
    const blob = await auCacheGet(e.h);
    if (!blob) { e.up = true; continue; }          // 本机也没有了，别再重试
    try { await ossPutBlob(audioKey(e), blob); e.up = true; } catch (err) { break; }
  }
  if (pend.length) saveBo(true);
}

async function cloudSync(force) {
  if (!ossReady()) { CLOUD.state = 'off'; return false; }
  if (CLOUD.busy) return false;
  CLOUD.busy = true; CLOUD.state = 'syncing'; CLOUD.msg = ''; paintCloudBar();
  try {
    let remote = null;
    try { remote = JSON.parse(await ossGetText(CLOUD_KEY)); }
    catch (e) { if (e.code !== 'NoSuchKey') throw e; }
    if (remote && remote.app === 'yulengua') cloudMerge(remote);
    await cloudPushPending();
    await ossPutText(CLOUD_KEY, JSON.stringify(cloudSnapshot()));
    CLOUD.state = 'ok'; CLOUD.last = Date.now(); CLOUD.msg = '';
    S.cfg.lastCloud = CLOUD.last; saveCfg(true);
    paintCloudBar();
    return true;
  } catch (e) {
    CLOUD.state = 'err'; CLOUD.msg = ossHint(e);
    paintCloudBar();
    return false;
  } finally { CLOUD.busy = false; }
}

let cloudTimer = null;
/* 数据一变就排一次上传，4 秒内的连续改动合并成一次请求 */
function cloudTouch() {
  if (!ossReady()) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => { cloudSync(true); }, 4000);
}

function paintCloudBar() {
  const el = typeof $ === 'function' ? $('cloudst') : null;
  if (!el) return;
  const t = { off: '未启用', syncing: '同步中…', ok: '已同步', err: '同步失败' }[CLOUD.state] || '未启用';
  const when = CLOUD.last ? '（' + new Date(CLOUD.last).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) + '）' : '';
  el.innerHTML = '<b>' + t + '</b>' + esc(when) +
    (CLOUD.msg ? '<div class="err" style="margin:8px 0 0">' + esc(CLOUD.msg) + '</div>' : '');
}

/* 真实地跑一遍 PUT → GET → DELETE，把 OSS 的原始错误码摊开给用户看 */

    await ossDel(key); steps.push('删除 ✓');
    m.innerHTML = '<div class="err"><b>云端连接成功</b><br>' + esc(steps.join(' → ')) +
      '<br>Bucket ' + esc(ossCfg().bucket) + ' · 地域 ' + esc(ossRegion()) + '</div>';
  } catch (e) {

      extra = ossAuthDiagHtml(await ossAuthDiag(key));
    }
    if (e && e.code === 'CORS_OR_NETWORK') {
      const kind = await ossProbe();
      extra = kind === 'cors'
        ? '<div class="err" style="margin:10px 0 0"><b>诊断结果：网络是通的，被拦住的是跨域规则（CORS）。</b>' +
          '<br>请到 Bucket → 数据安全 → 跨域设置，逐字核对下面三项：' +
          '<div class="note" style="margin-top:8px">' +
          '1. <b>来源 Source</b> 必须精确等于这一行（点右边可复制）：' +
          '<div class="row" style="margin:6px 0"><code style="font-size:13px;word-break:break-all">' + esc(location.origin) + '</code>' +
          '<button class="btn sm" onclick="copyText(' + jsq(location.origin) + ')">复制</button></div>' +
          '2. <b>允许 Headers</b> 必须填 <b>*</b>（一个星号）。<b>留空是不行的</b>——留空等于一个自定义请求头都不许带，而签名就在 Authorization 头里，浏览器在预检那一步就会被拒。' +
          '<br>3. <b>允许 Methods</b> 要勾满 GET / PUT / POST / DELETE / HEAD。少勾 PUT 就写不进去。' +
          '<br><br>另外确认这条规则是加在 <b>' + esc(ossCfg().bucket) + '</b> 这个 Bucket 上的，规则保存后生效通常在一分钟内。</div></div>'
        : '<div class="err" style="margin:10px 0 0"><b>诊断结果：连 ' + esc(ossHostname().host) + ' 都连不上，这不是 CORS 的问题。</b>' +
          '<div class="note" style="margin-top:8px">多半是 Endpoint 写错了（地域拼错会解析到一个不存在的域名），或者当前网络屏蔽了阿里云。换个网络再试一次。</div></div>';
    }
    m.innerHTML = '<div class="err"><b>失败于：' + esc(steps.length ? steps.join(' → ') + ' → 下一步' : '第一步写入') + '</b>' +
      '<br>' + esc(ossHint(e)) +
      '<div class="note" style="margin-top:8px">原始错误码：' + esc((e && e.code) || '无') +
      '<br>' + esc(String((e && e.message) || '').slice(0, 200)) +
      '<br>本页来源 Origin：' + esc(location.origin) +
      '<br>请求目标：' + esc(ossHostname().host) + '</div></div>' + extra;
  } finally { btn.innerHTML = old; btn.disabled = false; }
}

/* ================= Yulengua · AI ================= */

function needKey() {
  if (!S.cfg.key || !S.cfg.key.trim()) { toast('请先在设置中填写 API Key'); go('set'); return true; }
  return false;
}

async function ai(messages, wantJson) {
  const body = { model: (S.cfg.model || 'gpt-4.1').trim(), messages: messages };
  if (wantJson) body.response_format = { type: 'json_object' };
  const call = b => fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + S.cfg.key.trim(), 'Content-Type': 'application/json' },
    body: JSON.stringify(b)
  });
  let r = await call(body);
  if (!r.ok && wantJson && r.status === 400) { delete body.response_format; r = await call(body); }
  if (!r.ok) {
    let m = '';
    try { const j = await r.json(); m = (j.error && j.error.message) || ''; } catch (e) {}
    throw new Error('HTTP ' + r.status + (m ? ' · ' + m : ''));
  }
  const j = await r.json();
  return ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
}

async function aiJson(messages) {
  const raw = await ai(messages, true);
  let t = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a > 0 || b < t.length - 1) t = t.slice(a === -1 ? 0 : a, b === -1 ? t.length : b + 1);
  return JSON.parse(t);
}

/* 用户在词卡里手改过的注音，反哺给模型。

const BO_FEED_MAX = 15;
function boFeedSamples() {
  if (typeof boList !== 'function') return [];
  const out = [], cov = new Set();
  boList().filter(e => e.p).forEach(e => {
    if (out.length >= BO_FEED_MAX) return;
    const syl = boSyls(e.w);
    if (!syl.length || syl.some(s => !cov.has(s))) {
      syl.forEach(s => cov.add(s));
      out.push(e);
    }
  });
  return out;
}

function boPronRule() {
  const t = (S.cfg.boPron || '').trim();
  const mine = boFeedSamples();
  const feed = mine.length
    ? '\n\n【用户亲手改过的注音 —— 优先级最高，出现这些词时必须原样照抄】\n' +
      mine.map(e => e.w + ' = ' + e.p).join('\n') +
      '\n这些是用户逐个校对过的读音。遇到表中没有的词，请按这张表体现出来的拼写习惯类推。'
    : '';

  if (!t) {
    return '【安多话注音】用拉丁转写反映【安多口语实际发音】（不是拉萨话，也不是古典书面藏文的逐字母转写），' +
      '后加圆括号内的近似汉字注音。注意安多话保留复辅音前缀、不读部分后加字、元音无拉萨话式的变化。' + feed;
  }
  return '【安多话注音标准 —— 用户已指定，必须严格遵守】\n' +
    '下面是用户给出的注音样例对照表。你写注音时必须完全采用同一套拼写体系、同一套符号约定、同一种格式：\n' +
    t +
    '\n遇到样例中没出现过的音，按同一体系类推，不要混入其他转写方案（不要用 Wylie、不要用拉萨话读音）。' + feed;
}

/* 难度微调 */
function diffRule(k) {
  const n = (S.cfg.diff && S.cfg.diff[k]) || 0;
  const base = '【难度校准】上面「禁止重复」列出的句子就是用户最近实际在读的内容，请把它们当作当前难度的基准线。';
  if (!n) return base + '\n本次请生成一句与这些句子【难度相当】的新句子。';
  const dir = n > 0 ? '略难' : '略简单';
  const step = Math.abs(n);
  return base + '\n用户已把难度在这个基准上调整了 ' + (n > 0 ? '+' : '−') + step + ' 档。' +
    '\n本次请生成一句比基准线【' + dir + ' ' + step + ' 档】的句子。' +
    '\n一档是很小的一步，大致相当于：句子长 2–3 个词、或多一个从句、或多一个次常用词、或多一个新语法点。' +
    '严禁跨级跳跃（不要因为 +2 就直接写成高级文章，也不要因为 −2 就退化成单词罗列）。';
}

function lookupAskPrompt(item, qa, q) {

function dlgOpenPrompt(k, topic) {
  const L = LANGS[k];
  return [
    { role: 'system', content: BASE },
    {
      role: 'user', content:
        '设计一个' + L.zh + '（' + L.dialogue + '水平）的情景对话练习。用户给的提示是：「' + topic + '」\n' +
        '请据此设定一个具体、自然的场景，并说出对话的第一句（由你扮演的角色先开口）。\n' +
        '语言难度必须严格控制在' + L.dialogue + '，句子简短自然，像真实口语。\n\n' +
        '输出 JSON：{"scene":"用中文简述场景：地点、你扮演谁、用户扮演谁、对话目标","role":"你扮演的角色（中文）","line":"' + L.zh + '第一句话","zh":"中文翻译","en":"' + (L.en ? '英文翻译' : '留空') + '","tokens":["line 的逐词切分"],"gloss":["与 tokens 一一对应的极简中文词义"]}' +
        '\n' + TOKEN_RULE(k)
    }
  ];
}

function TOKEN_RULE(k) {
  const base = '"gloss" 数组长度必须与 "tokens" 完全一致，每项只写 2–8 个字的核心词义（助词/介词写其语法作用，如「（宾格助词）」）。';
  if (k === 'ja') return '"tokens" 按词切分（助词单独成词），拼接后须等于原句。' + base;
  return '"tokens" 按词切分（标点可并入相邻词），用空格连接后须还原原句。' + base;
}

function dlgTurnPrompt(k, scene, history, userLine) {
  const L = LANGS[k];
  const msgs = [{
    role: 'system', content: BASE + '\n\n你正在和一位' + L.zh + '学习者做情景对话练习。场景：' + scene +
      '\n语言难度严格控制在' + L.dialogue + '。你每轮要做两件事：(1) 批改用户上一句的' + L.zh + '，(2) 用' + L.zh + '自然地接着对话。' +
      '\n\n【关于 feedback.corrected 的硬性要求】' +
      '\ncorrected 必须是一个【可以直接朗读、直接背诵的最终正确版本】：完整的一句话，语法全对、用词地道、标点齐全、大小写正确。' +
      '\n· 不要在 corrected 里写解释、括号注释、"应改为"、箭头、删除线或任何标记，只写那一句正确的' + L.zh + '。' +
      '\n· 如果用户原句已经完全正确，corrected 就填一个在该场景下【最自然地道的说法】（可以和原句相同，也可以是更地道的等价说法）。' +
      '\n· 所有的解释、错在哪、为什么，全部放进 note 字段，用中文写。' +
      '\n\n输出 JSON：{"feedback":{"verdict":"ok 或 fix","corrected":"最终正确版本的完整句子","note":"中文讲解，说明错在哪、为什么；若原句已正确则说明为何这样说更自然。60–150 字","ctokens":["corrected 的逐词切分"],"cgloss":["与 ctokens 一一对应的极简中文词义"]},"line":"' + L.zh + '你的下一句话","zh":"中文翻译","en":"' + (L.en ? '英文翻译' : '留空') + '","tokens":["line 的逐词切分"],"gloss":["与 tokens 一一对应的极简中文词义"]}' +
      '\n' + TOKEN_RULE(k) + '\nctokens / cgloss 对 corrected 用同样的规则。'
  }];
  history.forEach(m => {
    if (m.who === 'sys') msgs.push({ role: 'assistant', content: m.line });
    else msgs.push({ role: 'user', content: m.line });
  });
  msgs.push({ role: 'user', content: userLine });
  return msgs;
}

  msgs.push({ role: 'user', content: q });
  return msgs;
}

const DIFF_MIN = -6, DIFF_MAX = 6;
const getDiff = k => Math.max(DIFF_MIN, Math.min(DIFF_MAX, (S.cfg.diff && S.cfg.diff[k]) || 0));
const diffTag = k => { const n = getDiff(k); return n ? (n > 0 ? ' +' + n : ' −' + (-n)) : ''; };
const diffText = k => { const n = getDiff(k); return n === 0 ? '基准' : (n > 0 ? '+' + n + ' 档' : '−' + (-n) + ' 档'); };
function bumpDiff(k, d) {
  S.cfg.diff[k] = Math.max(DIFF_MIN, Math.min(DIFF_MAX, getDiff(k) + d));
  saveCfg();
  const v = document.querySelector('[data-dv="' + k + '"]');
  if (v) v.textContent = diffText(k);
}

const R = { lang: null, hist: [], idx: -1, busy: false, err: '' };

function speakBtn(k, text, label) {

function paintRead() {

function buildSent(j, k) {
  const tokens = Array.isArray(j.tokens) ? j.tokens.filter(t => String(t).trim()) : [];
  const gloss = Array.isArray(j.gloss) ? j.gloss.map(x => String(x || '')) : [];
  let txt = (j.text || '').trim();
  let trl = (j.translit || '').trim();
  if (k === 'ru') { trl = ruLat(trl || txt); txt = ruPlain(txt); }
  return {
    text: txt,
    alt: k === 'kk' ? kkArab(txt) : (j.alt || '').trim(),
    translit: k === 'kk' ? kkLat(txt) : trl,
    zh: (j.zh || '').trim(), en: (j.en || '').trim(), tokens: tokens, gloss: gloss
  };
}

async function nextSent() {
  if (needKey() || R.busy) return;
  if (R.idx < R.hist.length - 1) { R.idx++; R.err = ''; paintRead(); return; }
  R.busy = true; R.err = ''; paintRead();
  try {
    const sent = buildSent(await aiJson(sentencePrompt(R.lang, getSeen(R.lang))), R.lang);
    if (!sent.text) throw new Error('模型返回了空句子');
    R.hist.push({ sent: sent, qa: [], show: false });
    if (R.hist.length > 60) R.hist.shift();
    R.idx = R.hist.length - 1;
    pushSeen(R.lang, sent.text);
  } catch (e) { R.err = '生成失败 · ' + e.message; }
  R.busy = false; paintRead();
}

/* 重新生成当前这一句：就地替换，不新增历史，也不把废句留在难度基准里 */
async function regenSent() {
  if (needKey() || R.busy) return;
  const c = cur();
  if (!c) { nextSent(); return; }
  const oldText = c.sent.text;
  R.busy = true; R.err = ''; paintRead();
  try {
    const sent = buildSent(await aiJson(sentencePrompt(R.lang, getSeen(R.lang))), R.lang);
    if (!sent.text) throw new Error('模型返回了空句子');
    S.seen[R.lang] = getSeen(R.lang).filter(t => t !== oldText);
    R.hist[R.idx] = { sent: sent, qa: [], show: false };
    pushSeen(R.lang, sent.text);
  } catch (e) { R.err = '重新生成失败 · ' + e.message; }
  R.busy = false; paintRead();
}

function prevSent() {
  if (R.idx <= 0 || R.busy) return;
  R.idx--; R.err = ''; paintRead();
}

/* ---------- 哈萨克字母形体 ---------- */
const KK_NONJOIN = 'اٵدذرزژوۇۆۋٶءأإآ';
const ZWJ = '\u200D';
function kkForms(ar) {
  const s = String(ar || '').trim();
  if (!s) return null;
  const base = s[s.length - 1];
  const joins = KK_NONJOIN.indexOf(base) === -1;
  return {
    iso: s,
    ini: joins ? s + ZWJ : null,
    med: joins ? ZWJ + s + ZWJ : null,
    fin: ZWJ + s
  };
}
function kkTable(word) {
  const letters = kkLetterRows(word);
  if (!letters.length) return '';
  const cell = v => v == null ? '<b class="na">—</b>' : '<b>' + esc(v) + '</b>';
  let h = '<div class="sec" style="margin-bottom:8px">字母对照</div><div class="klt">' +
    '<div class="hd"><span>西里尔</span><span class="fm">' +
    '<span>单立</span><span>前连</span><span>中连</span><span>后连</span></span><span class="lt">拉丁</span></div>';
  letters.forEach(l => {
    const f = l.ar ? kkForms(l.ar) : null;
    h += '<div class="rw"><span class="cy">' + esc(l.cy || '') + '</span>' +
      '<span class="fm">' + (f ? cell(f.iso) + cell(f.ini) + cell(f.med) + cell(f.fin) : cell(null) + cell(null) + cell(null) + cell(null)) + '</span>' +
      '<span class="lt">' + esc(l.lat || '') + '</span>' +
      (l.note ? '<span class="nt">' + esc(l.note) + '</span>' : '') + '</div>';
  });
  return h + '</div>';
}

/* ---------- word sheet: 第一层翻译 / 第二层详解 ---------- */
const wordCache = new Map();

function tokAt(i) {
  const s = cur().sent;
  const toks = s.tokens.length ? s.tokens : s.text.split(/\s+/);
  const raw = String(toks[i] || '');
  const clean = raw.replace(/^[\s.,!?;:«»""''()\[\]—–·-]+|[\s.,!?;:«»""''()\[\]—–·-]+$/g, '') || raw;
  return { raw: raw, word: clean, gloss: (s.gloss && s.gloss[i]) || '' };
}

/* 通用词卡：句子阅读和场景对话共用。
   第一层用随句返回的简译，瞬时、零请求；第二层才调 AI。 */
let WSHEET = null;

function showWord(k, word, gloss, context) {
  if (!word) return;
  WSHEET = { k: k, word: word, context: context || word };
  BO.edit = false; BO.busy = '';
  const ck = k + '|' + word + '|' + WSHEET.context;
  if (wordCache.has(ck)) { sheet(wordHtml(wordCache.get(ck))); return; }
  sheet(
    '<div class="wh"><span class="ww ' + scriptCls(k) + '">' + esc(word) + '</span></div>' +
    (k === 'kk' ? '<div class="ar" style="font-size:22px;margin-top:8px">' + esc(kkArab(word)) + '</div>' +
      '<div class="translit" style="margin-top:4px">' + esc(kkLat(word)) + '</div>' : '') +
    (k === 'ru' ? '<div class="translit" style="margin-top:6px">' + esc(ruLat(word)) + '</div>' : '') +
    '<div class="gl">' + (gloss ? esc(gloss) : '<span class="hint">这个词没有随句简译，点下方展开详解</span>') + '</div>' +
    (LANGS[k] && LANGS[k].tts ? '<div class="row" style="margin-top:14px">' + speakBtn(k, word) + '</div>' : '') +
    (k === 'bo' ? boPanel(word) : '') +
    '<div class="spacer"></div>' +
    '<button class="btn pri wide" onclick="expandWord(this)">展开详解</button>' +
    '<p class="note" style="text-align:center">展开会调用 AI，生成词性、变位、例句与详细解释</p>'
  );
}

function openWord(i, el) {
  document.querySelectorAll('.sent .w.on').forEach(n => n.classList.remove('on'));
  el && el.classList.add('on');
  const t = tokAt(i);
  showWord(R.lang, t.word, t.gloss, cur().sent.text);
}

async function expandWord(btn) {
  if (needKey() || !WSHEET) return;
  const w = WSHEET;
  const ck = w.k + '|' + w.word + '|' + w.context;
  btn.innerHTML = LOADER + ' 正在解析'; btn.disabled = true;
  try {
    const j = await aiJson(wordPrompt(w.k, w.word, w.context));
    if (!j || (!String(j.zh || '').trim() && !String(j.note || '').trim())) throw new Error('模型返回了空解析');
    j._lang = w.k;
    wordCache.set(ck, j);
    sheet(wordHtml(j));
  } catch (e) {
    btn.innerHTML = '重试'; btn.disabled = false;
    const p = document.createElement('div');
    p.className = 'err'; p.textContent = '解析失败 · ' + e.message;
    btn.parentNode.insertBefore(p, btn);
  }
}

/* 把一句话渲染成可点击的词；tokens/gloss 缺失时按空格切分兜底 */
const cleanTok = s => String(s || '').replace(/^[\s.,!?;:«»""''()\[\]—–·-]+|[\s.,!?;:«»""''()\[\]—–·-]+$/g, '') || String(s || '');
function tapWords(k, text, tokens, gloss, group) {
  const toks = (Array.isArray(tokens) && tokens.length) ? tokens : String(text || '').split(/\s+/);
  const j = (k === 'ja' || k === 'bo') ? '' : ' ';
  return toks.map((t, i) =>
    '<span class="w" data-tw="' + group + '" data-ti="' + i + '">' + esc(t) + '</span>').join(j);
}
function bindTapWords(k, getSource) {
  document.querySelectorAll('[data-tw]').forEach(el => {
    el.onclick = () => {
      const src = getSource(el.dataset.tw);
      if (!src) return;
      const i = +el.dataset.ti;
      const toks = (Array.isArray(src.tokens) && src.tokens.length) ? src.tokens : String(src.text || '').split(/\s+/);
      document.querySelectorAll('[data-tw].on').forEach(n => n.classList.remove('on'));
      el.classList.add('on');
      showWord(k, cleanTok(toks[i]), (src.gloss && src.gloss[i]) || '', src.text);
    };
  });
}

function wordHtml(j) {
  const k = j._lang, L = LANGS[k];
  if (k === 'kk') {
    j.alt = kkArab(j.word || '');
    j.translit = kkLat(j.word || '');
  }
  if (k === 'ru') {
    j.translit = ruLat(j.translit || j.word || '');
    j.word = ruPlain(j.word || '');
    j.lemma = ruPlain(j.lemma || '');
    if (j.example && j.example.text) j.example.text = ruPlain(j.example.text);
    if (Array.isArray(j.forms)) j.forms = j.forms.map(f =>
      ({ k: f.k, v: ruDualInline(String(f.v == null ? '' : f.v)) }));

  let h = '<div class="wh">' +

    (j.pos ? '<span class="tag">' + esc(j.pos) + '</span>' : '') +
    (j.lemma && j.lemma !== j.word ? '<span class="lm">原形 ' + esc(j.lemma) + '</span>' : '') +
    '</div>';
  if (j.alt) h += '<div class="ar" style="font-size:20px;margin-top:8px">' + esc(j.alt) + '</div>';
  if (j.translit) h += '<div class="translit" style="margin-top:6px">' + esc(j.translit) + '</div>';
  if (L.tts) h += '<div class="row" style="margin-top:12px">' + speakBtn(k, j.word || '') + '</div>';
  h += '<div class="def">' + esc(j.zh || '') +
    (j.en ? '<div class="hint" style="margin-top:5px;font-size:13.5px">' + esc(j.en) + '</div>' : '') + '</div>';
  if (j.example && j.example.text) {

      speakBtn(k, j.example.text, false) +

/* 词卡内追问：问答跟着这个词一起缓存，重新打开还在 */

/* ---------- 详解预览 / 编辑 ---------- */
let DE = { mode: 'raw' };

function lintBar(text, id) {
  const r = markjiLint(text);
  const canFix = r.text !== text;
  if (r.ok && !canFix) return '<div class="lint"><b>&#10003; 墨墨语法检查通过</b>可以直接复制进墨墨记忆卡。</div>';
  let h = '<div class="lint' + (r.warn.length ? ' bad' : '') + '"><b>' +
    (r.warn.length ? '墨墨语法检查发现 ' + r.warn.length + ' 处问题' : '有可以自动整理的地方') + '</b>';
  if (r.warn.length) h += '<ul>' + r.warn.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>';
  if (canFix) h += '<div class="row" style="margin-top:9px"><button class="btn sm" onclick="applyLint(\'' + id + '\')">一键整理</button></div>';
  return h + '</div>';
}
function applyLint(id) {
  const cu = S.stack[S.stack.length - 1].arg;
  const r = markjiLint(deText(id));
  cu.text = r.text;
  render();
  toast(r.fixed.length ? '已整理：' + r.fixed.join('；') : '没有可自动整理的问题');
}

function deditBody(d, id) {
  return '<div class="row" style="margin-bottom:12px">' +
    '<button class="btn sm' + (DE.mode === 'raw' ? ' on' : '') + '" onclick="DE.mode=\'raw\';render()">原文</button>' +
    '<button class="btn sm' + (DE.mode === 'view' ? ' on' : '') + '" onclick="DE.mode=\'view\';render()">渲染预览</button>' +
    (existingCard(d) ? '<span class="hint" style="margin-left:auto">卡片库中已有这一条，保存将覆盖</span>' : '') +
    '</div>' +
    (DE.mode === 'raw'
      ? '<textarea class="fld" id="' + id + '" style="min-height:54vh;font-size:14px;line-height:1.75;font-family:ui-monospace,Menlo,monospace">' + esc(d.text) + '</textarea>'
      : '<div class="rend">' + renderCodes(d.text) + '</div>') +
    lintBar(d.text, id);
}
function bindDedit(id) {
  if (DE.mode === 'raw' && $(id)) $(id).oninput = () => { S.stack[S.stack.length - 1].arg.text = $(id).value; };
}
function deText(id) {
  const cu = S.stack[S.stack.length - 1].arg;
  return ((DE.mode === 'raw' && $(id)) ? $(id).value : cu.text).trim();
}
function existingCard(d) {
  return d.front ? S.cards.find(x => x.lang === d.lang && x.front === d.front) : null;
}

VIEWS.dedit = function (d) {

    '<div class="spacer"></div>' +

};

function copyDetail() { copyText(deText('dtext')); }

function saveDetail() {
  const cu = S.stack[S.stack.length - 1].arg;
  const text = deText('dtext');
  const old = existingCard(cu);
  if (old) {
    const changed = old.detail !== text;
    old.detail = text; old.ts = Date.now();
    if (changed) old.added = false;
    S.cards = [old].concat(S.cards.filter(x => x !== old));
    saveCards(); back();
    toast(changed ? '已更新卡片库中的这一条' : '内容无变化，已保留原卡片');
    return;
  }
  S.cards.unshift({
    id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
    lang: cu.lang, front: cu.front, detail: text, added: false, ts: Date.now()
  });
  const dropped = trimCards();
  saveCards(); back();
  toast('已存入卡片库（共 ' + S.cards.length + ' 张）' + (dropped ? ' · 已回收 ' + dropped + ' 张旧的已添加卡片' : ''));
}
/* ================= Yulengua · 藏语发音（手改注音 + 自己录音）=================
   只在藏语（bo）出现。注音和录音都按「归一化词形」存储，所以同一个词
   在不同句子里出现时是同一条记录，录过一次以后到处都能回放。 */

const BO = { edit: false, rec: false, busy: '', t0: 0, timer: null, mr: null, stream: null, word: '' };

function boDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}

/* 词卡里的藏语面板。word 是句中形式，内部统一归一化。 */
function boPanel(word) {
  return '<div id="bopanel">' + boPanelHtml(word) + '</div>';
}

function boPanelHtml(word) {
  const k = boKey(word);
  const e = boGet(k);
  const hasAudio = !!(e && e.h);
  let h = '<div class="bopn"><div class="hd">我的注音与录音<span>' + esc(k) + '</span></div>';

  if (BO.edit) {
    h += '<textarea class="fld" id="bopin" rows="2" style="min-height:52px;font-size:15px" ' +
      'placeholder="按你自己的注音体系写，例如 yod（约）">' + esc((e && e.p) || '') + '</textarea>' +
      '<div class="row" style="margin-top:9px">' +
      '<button class="btn sm pri" onclick="boSavePron(' + jsq(k) + ')">保存注音</button>' +
      '<button class="btn sm" onclick="BO.edit=false;boRefresh(' + jsq(k) + ')">取消</button></div>';
  } else {
    h += '<div class="pv">' + (e && e.p
      ? '<b>' + esc(e.p) + '</b>'
      : '<i>还没有手写注音，用的是 AI 给的那一行</i>') +
      '<button class="btn sm" onclick="BO.edit=true;boRefresh(' + jsq(k) + ')">' +
      (e && e.p ? '改注音' : '写注音') + '</button></div>';
  }

  h += '<div class="row" style="margin-top:12px">';
  if (BO.rec) {
    h += '<button class="btn sm rec" onclick="boRecStop()">&#9632; 停止 <span id="boclk">0:00</span></button>';
  } else {
    h += '<button class="btn sm" onclick="boRecStart(' + jsq(k) + ')">&#9679; ' + (hasAudio ? '重录' : '录我的发音') + '</button>';
  }
  if (hasAudio) {
    h += '<button class="btn sm" onclick="boPlay(' + jsq(k) + ',this)">&#9654; 播放</button>' +
      '<button class="btn sm" onclick="boDelete(' + jsq(k) + ')">删除录音</button>';
  }
  h += '</div>';

  if (BO.busy) h += '<div class="hint" style="margin-top:9px">' + esc(BO.busy) + '</div>';
  else if (hasAudio) h += '<div class="hint" style="margin-top:9px">已录 ' + (e.d ? boDur(e.d) + ' · ' : '') +
    (ossReady() ? (e.up === false ? '待上传，联网后自动补传' : '已存云端') : '仅存本机（云端未启用）') + '</div>';
  else h += '<div class="hint" style="margin-top:9px">录一遍自己的发音，以后这个词出现在任何句子里都能点开重听。</div>';

  return h + '</div>';
}

function boRefresh(word) {
  const el = $('bopanel');
  if (el) el.innerHTML = boPanelHtml(word);
  if (BO.edit && $('bopin')) $('bopin').focus();
}

function boSavePron(word) {
  const ta = $('bopin');
  if (!ta) return;
  const v = ta.value.trim();
  const k = boKey(word);
  if (!v && !boGet(k)) { BO.edit = false; boRefresh(k); return; }
  boSet(k, { p: v });
  BO.edit = false;
  boRefresh(k);
  toast(v ? '注音已保存，以后 AI 会照这个写' : '已清空这个词的手写注音');
  if (typeof paintRead === 'function' && R.lang === 'bo') paintRead();
}

/* ---------- 录音 ---------- */
function boMime() {
  if (typeof MediaRecorder === 'undefined') return null;
  /* iOS 只给 audio/mp4（AAC），其余浏览器优先 opus */
  const list = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
  for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
  return '';
}

async function boRecStart(word) {
  if (BO.rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    toast('这个浏览器不支持录音。iOS 请用 Safari，并确保是 https 打开的');
    return;
  }
  BO.word = boKey(word); BO.busy = '正在请求麦克风权限…'; boRefresh(BO.word);
  try {
    BO.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    BO.busy = '';
    boRefresh(BO.word);
    toast(/NotAllowed|Permission/i.test(String(e.name || e.message))
      ? '麦克风权限被拒绝。到 iOS 设置 → Safari → 麦克风 里允许'
      : '打不开麦克风 · ' + e.message);
    return;
  }
  const mime = boMime();
  try {
    BO.mr = mime ? new MediaRecorder(BO.stream, { mimeType: mime }) : new MediaRecorder(BO.stream);
  } catch (e) { BO.mr = new MediaRecorder(BO.stream); }
  const chunks = [];
  BO.mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  BO.mr.onstop = () => {
    const dur = Date.now() - BO.t0;
    const blob = new Blob(chunks, { type: BO.mr.mimeType || mime || 'audio/mp4' });
    boCleanupRec();
    if (!blob.size) { BO.busy = ''; boRefresh(BO.word); toast('没有录到声音'); return; }
    boStore(BO.word, blob, dur);
  };
  BO.rec = true; BO.t0 = Date.now(); BO.busy = '';
  BO.mr.start();
  boRefresh(BO.word);
  BO.timer = setInterval(() => {
    const c = $('boclk');
    if (c) c.textContent = boDur(Date.now() - BO.t0);
    if (Date.now() - BO.t0 > 30000) boRecStop();       // 30 秒硬上限，防止误触录一小时
  }, 250);
}

function boRecStop() {
  if (!BO.rec || !BO.mr) return;
  try { BO.mr.stop(); } catch (e) { boCleanupRec(); boRefresh(BO.word); }
}

function boCleanupRec() {
  BO.rec = false;
  clearInterval(BO.timer); BO.timer = null;
  if (BO.stream) { try { BO.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
  BO.stream = null; BO.mr = null;
}

async function boStore(word, blob, dur) {
  const k = boKey(word);
  BO.busy = '正在保存（' + fmtBytes(blob.size) + '）…'; boRefresh(k);
  try {
    const h = await hashKey(k);
    const x = extOf(blob.type);
    const old = boGet(k);
    await auCacheSet(h, blob);                    // 先落本机，保证马上能回放
    let up = false;
    if (ossReady()) {
      try { await ossPutBlob('audio/' + h + '.' + x, blob, blob.type); up = true; }
      catch (e) { toast('云端上传失败，已先存本机 · ' + ossHint(e)); }
    }
    /* 换了容器格式时，把云端的旧对象删掉，免得留垃圾 */
    if (old && old.h === h && old.x && old.x !== x && ossReady()) ossDel('audio/' + h + '.' + old.x).catch(() => {});
    auUrls.delete(h);
    boSet(k, { h: h, x: x, d: dur, up: up });
    BO.busy = '';
    boRefresh(k);
    toast(up ? '已录好并同步到云端' : '已录好，存在本机');
    if (typeof paintRead === 'function' && R.lang === 'bo') paintRead();
  } catch (e) {
    BO.busy = ''; boRefresh(k);
    toast('保存失败 · ' + e.message);
  }
}

async function boPlay(word, btn) {
  const e = boGet(word);
  if (!e || !e.h) return;
  primeAudio();                                   // iOS 必须在手势里同步执行
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.innerHTML = '···'; btn.disabled = true; }
  try {
    const url = await audioUrl(e);
    playUrl(url);
  } catch (err) {
    toast('播放失败 · ' + ossHint(err));
  } finally { if (btn) { btn.innerHTML = old; btn.disabled = false; } }
}

function boDelete(word) {
  const k = boKey(word);
  if (!confirm('删除「' + k + '」的录音？手写注音会保留。')) return;
  const e = boGet(k);
  if (e && e.h) { auCacheDel(e.h); auUrls.delete(e.h); if (ossReady()) ossDel(audioKey(e)).catch(() => {}); }
  boSet(k, { h: '', x: '', d: 0, up: false });
  boRefresh(k);
  toast('已删除录音');
  if (typeof paintRead === 'function' && R.lang === 'bo') paintRead();
}
