<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Yulengua</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yulengua">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/png;base64,__APPLE__">
<link rel="icon" href="data:image/png;base64,__FAV__">
<link rel="manifest" href="__MANIFEST__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500&family=Noto+Serif+Tibetan:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 西里尔手写体（内嵌子集，见 build/fonts.py）。不走 CDN 是为了断网时不会
   静默退回系统字体——那样看着像正常显示，其实根本不是手写体。 */
__FONTS__
:root{
  --bg:#ffffff; --fg:#0a0a0a; --fg2:#5c5c5c; --fg3:#9a9a9a;
  --line:#e6e6e6; --line2:#d0d0d0; --soft:#f6f6f6; --inv-bg:#0a0a0a; --inv-fg:#ffffff;
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --fg:#f2f2f2; --fg2:#a0a0a0; --fg3:#6a6a6a;
    --line:#242424; --line2:#3a3a3a; --soft:#131313; --inv-bg:#f2f2f2; --inv-fg:#000000;
    --sh:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ---------- layout ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:100vh}
.screen.on{display:flex}
.nav{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(var(--safeT) + 10px) 18px 10px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
}
.nav .ttl{font-size:15px;font-weight:600;letter-spacing:.02em;flex:1;text-align:center;margin:0 -32px}
.nav button.ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:17px;color:var(--fg);flex:none;z-index:1}
.nav button.ic:active{background:var(--soft)}
.body{flex:1;padding:22px 18px calc(var(--safeB) + 28px);max-width:720px;width:100%;margin:0 auto}
.body.withbar{padding-bottom:calc(var(--safeB) + 96px)}

/* ---------- home ---------- */
.brand{padding:11vh 0 7vh;text-align:center}
.brand h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:400;margin:0;letter-spacing:.04em}
.brand .rule{width:76px;height:1px;background:var(--fg);margin:14px auto 0}
.brand p{color:var(--fg3);font-size:12px;letter-spacing:.22em;margin:14px 0 0;text-transform:uppercase}
.menu{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:active{background:var(--soft)}
.item .n{font-family:Georgia,serif;font-size:12px;color:var(--fg3);width:20px;flex:none}
.item .t{flex:1}
.item .t b{display:block;font-size:17px;font-weight:600;letter-spacing:.01em}
.item .t s{display:block;font-size:12px;color:var(--fg3);text-decoration:none;margin-top:3px;letter-spacing:.04em}
.item .chev{color:var(--fg3);font-size:15px}
.item[disabled]{opacity:.32}
.badge{font-size:10px;border:1px solid var(--line2);color:var(--fg3);padding:1px 6px;border-radius:99px;margin-left:8px;vertical-align:2px}

/* ---------- cards / text ---------- */
.card{border:1px solid var(--line);border-radius:16px;padding:22px 20px;background:var(--bg);box-shadow:var(--sh)}
.sent{font-size:24px;line-height:1.62;font-weight:500;letter-spacing:.005em;word-break:break-word}
.w{cursor:pointer;border-bottom:1px solid transparent;padding:1px 0;border-radius:2px}
.w:active,.w.on{background:rgba(128,128,128,.18);border-bottom-color:var(--fg2)}
.tb{font-family:"Noto Serif Tibetan","Kailasa","Microsoft Himalaya",serif;font-size:26px;line-height:2.1}
.ar{font-family:"Noto Sans Arabic","Geeza Pro",serif;font-size:25px;line-height:2;direction:rtl;text-align:right}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.translit{font-size:14px;color:var(--fg2);letter-spacing:.02em;margin-top:10px;font-style:italic}
/* 手写体：给俄语和哈萨克语看的连笔字形 */
.hand{font-family:"Hand",cursive;font-size:29px;line-height:1.85;margin-top:14px;
  word-break:break-word;color:var(--fg)}
.hand.sm{font-size:24px;line-height:1.7;margin-top:8px}
.handlb{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);margin-top:16px}
.trans{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line2);font-size:15px;color:var(--fg2);line-height:1.7}
.trans .en{margin-top:6px;font-size:14px;color:var(--fg3)}
.hint{color:var(--fg3);font-size:12.5px;letter-spacing:.03em}
.sec{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);margin:26px 0 10px}

/* ---------- buttons ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);border-radius:99px;padding:8px 16px;font-size:13.5px;letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:active{background:var(--soft)}
.btn.pri{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.pri:active{opacity:.75}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--soft);border-color:var(--fg2)}
.wide{width:100%;justify-content:center;padding:14px;border-radius:14px}
.split{display:flex;gap:8px}
.split .btn{flex:1;justify-content:center;padding:13px 8px;border-radius:13px;font-size:14px}

/* ---------- inputs ---------- */
.fld{width:100%;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;background:var(--bg);
  font-size:16px;outline:none;-webkit-appearance:none}
.fld:focus{border-color:var(--fg2)}
textarea.fld{line-height:1.65;resize:vertical;min-height:120px}
label.lb{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:20px 0 7px}
.note{font-size:12.5px;color:var(--fg3);margin-top:7px;line-height:1.55}

/* ---------- bottom ask bar ---------- */
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 14px calc(var(--safeB) + 10px);
  display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto}
.askbar textarea{flex:1;border:1px solid var(--line2);border-radius:20px;padding:10px 14px;font-size:16px;
  background:var(--bg);outline:none;resize:none;max-height:120px;line-height:1.45;min-height:41px}
.askbar .go{width:41px;height:41px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.askbar .go[disabled]{opacity:.3}

/* ---------- chat ---------- */
.qa{margin-top:14px;border-left:2px solid var(--line);padding-left:14px}
.qa .q{font-size:14px;color:var(--fg);font-weight:600;margin-top:16px}
.qa .a{font-size:14.5px;color:var(--fg2);line-height:1.75;white-space:pre-wrap;margin-top:6px}
.qa .a:first-child{margin-top:0}

/* ---------- word sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:90;display:none;backdrop-filter:blur(2px)}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--bg);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:86vh;overflow-y:auto;
  padding:12px 20px calc(var(--safeB) + 26px);transform:translateY(100%);
  transition:transform .24s cubic-bezier(.32,.72,0,1),visibility .24s;visibility:hidden;
  max-width:720px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0);visibility:visible}
.xbar{display:flex;justify-content:flex-end;margin:0 -4px 6px;position:sticky;top:-12px;
  background:var(--bg);padding:4px 0 6px;z-index:5}
.xb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.xb:active{background:var(--soft)}
.wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wh .ww{font-size:27px;font-weight:600}
.wh .lm{font-size:13px;color:var(--fg3)}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 7px;color:var(--fg2);letter-spacing:.04em}
.def{font-size:16px;margin-top:12px;line-height:1.7}
.ex{background:var(--soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.65}
.ex s{display:block;text-decoration:none;color:var(--fg2);font-size:13.5px;margin-top:4px}
.forms{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.forms div{padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.forms div:last-child{border-bottom:none}
.forms div b{color:var(--fg3);font-weight:400;min-width:74px;flex:none;font-size:12.5px}
.expl{font-size:14.5px;color:var(--fg2);line-height:1.78;margin-top:14px;white-space:pre-wrap}
.wask{display:flex;gap:8px;align-items:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.wask textarea{flex:1;border:1px solid var(--line2);border-radius:20px;padding:10px 14px;font-size:16px;
  background:var(--bg);outline:none;resize:none;max-height:120px;line-height:1.45;min-height:41px}
.wask .go{width:41px;height:41px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}

/* first layer gloss */
.gl{font-size:20px;line-height:1.6;margin:16px 0 2px}
.gl .sub{color:var(--fg3);font-size:13px;margin-top:6px;font-style:italic}

/* tibetan: my pronunciation + recording */
.w{position:relative}
.w.has::after,.w.pron::after{content:"";position:absolute;left:50%;bottom:-5px;width:5px;height:5px;
  margin-left:-2.5px;border-radius:50%;background:var(--fg)}
.w.pron::after{background:none;border:1px solid var(--fg3);width:4px;height:4px;margin-left:-2px}
.bopn{margin-top:18px;border:1px solid var(--line2);border-radius:12px;padding:14px 15px;background:var(--soft)}
.bopn .hd{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);
  margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bopn .hd span{font-family:"Noto Serif Tibetan",serif;font-size:17px;color:var(--fg2);letter-spacing:0;text-transform:none}
.bopn .pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bopn .pv b{font-size:17px;font-weight:600;flex:1;min-width:120px;word-break:break-word}
.bopn .pv i{font-size:13px;color:var(--fg3);flex:1;min-width:120px}
.bopn textarea{background:var(--bg)}
.btn.rec{border-color:var(--fg);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* kazakh letter table */
.klt{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.klt .hd,.klt .rw{display:grid;grid-template-columns:38px 1fr 56px;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);align-items:center}
.klt .hd{background:var(--soft);color:var(--fg3);font-size:10.5px;letter-spacing:.1em}
.klt .rw:last-child{border-bottom:none}
.klt .cy{font-size:17px;font-weight:600}
.klt .fm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.klt .fm b{font-family:"Noto Sans Arabic","Geeza Pro",serif;font-weight:400;font-size:19px;line-height:1.6;
  border:1px solid var(--line);border-radius:6px;text-align:center;direction:rtl;color:var(--fg)}
.klt .fm b.na{color:var(--fg3);font-size:13px;font-family:inherit}
.klt .hd .fm span{text-align:center;font-size:10px;letter-spacing:0}
.klt .lt{text-align:right;color:var(--fg2);font-size:13px;font-style:italic}
.klt .nt{grid-column:1/-1;color:var(--fg3);font-size:12px;line-height:1.5;margin-top:-2px}

/* ---------- dialogue ---------- */
.msg{margin-bottom:20px;max-width:92%}
.msg.me{margin-left:auto}
.bub{border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:17px;line-height:1.6}
.msg.me .bub{background:var(--soft);border-color:var(--soft);border-bottom-right-radius:5px}
.msg.sys .bub{border-bottom-left-radius:5px}
.bub.veil{border-style:dashed;color:var(--fg3);font-size:14px;font-style:italic;letter-spacing:.04em}
.msg .tr{font-size:13.5px;color:var(--fg2);padding:9px 4px 0;line-height:1.6;display:none}
.msg .tr.on{display:block}
.msg .tr .e{color:var(--fg3);font-size:12.5px;margin-top:3px}
.msg .ctl{display:flex;gap:14px;padding:7px 6px 0;font-size:12px;color:var(--fg3)}
.fix{border:1px solid var(--line2);border-left:3px solid var(--fg);border-radius:10px;padding:12px 14px;
  margin:0 0 18px;font-size:14px;line-height:1.65;background:var(--soft)}
.fix b.h{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px;font-weight:400}
.fix .cor{display:flex;align-items:flex-start;gap:9px;font-size:16px;line-height:1.55;margin-bottom:8px}
.fix .cor span{flex:1}
.fix .nt{color:var(--fg2);font-size:13.5px;line-height:1.65}
.scene{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--fg2);
  line-height:1.65;margin-bottom:22px;background:var(--soft)}
.scene b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px;font-weight:400}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.swi{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:99px;
  padding:6px 14px 6px 10px;font-size:12.5px;color:var(--fg3)}
.swi .kn{width:32px;height:18px;border-radius:99px;background:var(--line2);position:relative;transition:.18s;flex:none}
.swi .kn i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:.18s}
.swi.on{color:var(--fg);border-color:var(--inv-bg)}
.swi.on .kn{background:var(--inv-bg)}
.swi.on .kn i{left:16px}

/* ---------- settings stepper ---------- */
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.stp .nm{flex:1}
.stp .nm b{font-size:15px;font-weight:600;display:block}
.stp .nm s{font-size:11.5px;color:var(--fg3);text-decoration:none;display:block;margin-top:3px;line-height:1.4}
.stp .ct{display:flex;align-items:stretch;flex:none}
.stp .ct button{width:34px;height:34px;border:1px solid var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--fg)}
.stp .ct button:active{background:var(--soft)}
.stp .ct button:first-child{border-radius:9px 0 0 9px}
.stp .ct button:last-child{border-radius:0 9px 9px 0;border-left:none}
.msel{flex:none;max-width:46%;border:1px solid var(--line2);border-radius:9px;padding:7px 9px;
  background:var(--bg);color:var(--fg);font-size:13px;outline:none}
.stp .ct .v{min-width:52px;text-align:center;font-size:12px;color:var(--fg2);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em}

/* ---------- card library ---------- */
.lib{border-top:1px solid var(--line)}
.lc{border-bottom:1px solid var(--line);padding:16px 2px}
.lc .top{display:flex;align-items:flex-start;gap:12px}
.lc .cb{width:21px;height:21px;border:1px solid var(--line2);border-radius:6px;flex:none;margin-top:3px;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.lc.done .cb{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.lc.done .fr{text-decoration:line-through;color:var(--fg3)}
/* 背单词 的勾选只表示「选中」，还没到划掉那一步，所以不加删除线 */
.lc.sel .cb{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.lc .fr{flex:1;font-size:16px;line-height:1.55;font-weight:500;word-break:break-word}
.lc .mt{font-size:11px;color:var(--fg3);margin-top:5px;letter-spacing:.06em}
.lc .acts{display:flex;gap:8px;margin-top:12px;padding-left:33px;flex-wrap:wrap}
/* 卡片库（.lcd）：整行可点展开，右边两个图标按钮；Pulse / 藏语发音库共用 .lc，别动上面那些 */
.lcd .top{align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lcd .mt{font-size:11.5px;margin-top:12px;letter-spacing:.04em}
.lcd .acts{padding-left:0}
.lcd .side{display:flex;gap:6px;flex:none}
.lcd .ib{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--fg);
  display:flex;align-items:center;justify-content:center;padding:0}
.lcd .ib:active{background:var(--soft)}
.lcd .ib:disabled{opacity:.5}
.lsec{font-size:12px;letter-spacing:.08em;color:var(--fg3);margin:16px 0 0}
.ltabs{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 14px;padding:2px;-webkit-overflow-scrolling:touch}
.ltabs button{flex:none;border:1px solid var(--line2);border-radius:999px;background:var(--bg);color:var(--fg2);
  padding:7px 13px;font-size:13px;white-space:nowrap}
.ltabs button i{font-style:normal;font-size:11px;margin-left:6px;color:var(--fg3)}
.ltabs button.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.ltabs button.on i{color:var(--inv-fg);opacity:.75}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--fg2);background:var(--soft);
  border-radius:10px;padding:13px;margin-top:11px;max-height:220px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lint{border:1px solid var(--line2);border-radius:10px;padding:11px 13px;margin-top:11px;font-size:12.5px;line-height:1.65;color:var(--fg2)}
.lint.bad{border-left:3px solid var(--fg)}
.lint b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.lint ul{margin:5px 0 0;padding-left:18px}
.lint li{margin:2px 0}
.rend{white-space:pre-wrap;font-size:14.5px;line-height:1.8;margin-top:11px;border:1px solid var(--line);
  border-radius:10px;padding:15px}
.rend hr{border:none;border-top:1px solid var(--fg3);margin:14px 0}
/* 卡片库里展开的渲染视图：要整张看完，所以不限高 */
.lrend{font-size:15px;margin-top:12px;background:var(--bg)}
.lrend.tb{font-size:19px;line-height:2}
.mjf{border-bottom:2px solid var(--fg2);padding:0 4px;background:rgba(128,128,128,.12)}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--fg3);padding:16vh 20px;font-size:14px;line-height:1.9}
.empty .big{font-family:Georgia,serif;font-size:34px;color:var(--line2);display:block;margin-bottom:14px}
.load{display:inline-flex;gap:4px;align-items:center;color:var(--fg3);font-size:13px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--fg3);animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:1}}
.err{border:1px solid var(--line2);border-left:3px solid var(--fg);border-radius:8px;padding:12px 14px;
  font-size:13px;color:var(--fg2);margin:14px 0;line-height:1.6;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--safeB) + 84px);
  background:var(--inv-bg);color:var(--inv-fg);padding:11px 20px;border-radius:99px;font-size:13.5px;z-index:200;
  opacity:0;transition:.22s;pointer-events:none;display:flex;gap:14px;align-items:center;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto}
.toast button{color:var(--inv-fg);text-decoration:underline;font-size:13.5px;white-space:nowrap;pointer-events:auto}
.spacer{height:12px}
</style>
